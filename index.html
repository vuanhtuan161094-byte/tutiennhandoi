<body>
  <div id="app" class="game-shell">
    <header class="topbar">
      <div id="playerHeader" class="player-header"></div>
      <div class="topbar-actions">
        <span id="saveState" class="save-state" role="status" aria-live="polite">Đang kết nối…</span>
        <details class="system-menu">
          <summary aria-label="Mở thiết lập">☰</summary>
          <div class="system-menu-panel">
            <div id="systemQuickMenu" class="system-quick-menu" aria-label="Tiện ích nhanh"></div>
            <div class="system-menu-divider"></div>
            <button id="exportSave" class="menu-action">Xuất save</button>
            <button id="restoreBackup" class="menu-action" disabled>Khôi phục backup gần nhất</button>
            <label class="menu-action file-button">Nhập save<input id="importSave" type="file" accept="application/json,.json" /></label>
            <button id="newGame" class="menu-action danger">Nhân vật mới</button>
          </div>
        </details>
      </div>
    </header>

    <div class="viewport-shell">
      <aside id="quickNav" class="quick-nav" aria-label="Điều hướng phụ"></aside>
      <main class="main">
        <div id="notice" class="notice hidden"></div>
        <section id="content" class="content" aria-live="off"></section>
      </main>
    </div>

    <nav id="nav" class="bottom-nav" aria-label="Điều hướng chính"></nav>
  </div>

  <dialog id="confirmDialog">
    <form method="dialog">
      <h3 id="confirmTitle">Xác nhận</h3>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button value="cancel" class="button ghost">Hủy</button>
        <button value="ok" class="button danger">Xác nhận</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/standalone-entry.js?v=v140-combat-visual-polish-v2-20260915"></script>
  <script src="/ui-home-target-v1.js?v=target-home-v1-rail3-20260913" defer></script>
  <script src="/ui-combat-target-v1.js?v=combat-third-party-tools-v3-20260915" defer></script>
  <script src="/pwa-register.js?v=v140-cultivation-clean-20260906" defer></script>
</body>
</html>
