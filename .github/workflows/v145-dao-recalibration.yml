name: V145 Dao Recalibration

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v142-equipment-hunt
    paths:
      - 'qa/tools/v145-dao-recalibrate.mjs'
      - '.github/workflows/v145-dao-recalibration.yml'

permissions:
  contents: write

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v142-equipment-hunt
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared-kernel recalibration
        run: node qa/tools/v145-dao-recalibrate.mjs
      - name: Global build balance
        run: node qa/tests/v129-global-build-balance-test.js
      - name: V145 gates
        run: |
          node qa/tests/v145-spiritual-root-redesign-test.js
          node qa/tests/v145-spiritual-root-runtime-test.js
          node qa/tests/v145-spiritual-root-realm-origin-test.js
          node qa/tests/v145-spiritual-root-ui-test.js
      - name: Backend closure
        run: node qa/runners/v140-backend-gates.js closure
      - name: Frontend closure
        run: node qa/runners/v140-frontend-gates.js closure
      - name: Remove temporary machinery
        run: |
          rm qa/tools/v145-dao-recalibrate.mjs
          rm .github/workflows/v145-dao-recalibration.yml
      - name: Commit calibration
        run: |
          git config user.name 'vuanhtuan161094-byte'
          git config user.email 'vuanhtuan161094@gmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'balance(v145): recalibrate dao after root retirement'
          git push origin HEAD:feature/v142-equipment-hunt
