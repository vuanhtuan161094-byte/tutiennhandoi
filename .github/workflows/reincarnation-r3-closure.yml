name: Luân Hồi R3 Closure

on:
  push:
    branches:
      - feature/reincarnation-cultivation-r3

permissions:
  contents: read

concurrency:
  group: reincarnation-r3-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout R3 branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: R3 RP cost invariant
        run: node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js

      - name: R3 dedicated gameplay regression
        run: node qa/tests/reincarnation-cultivation-r3-test.js

      - name: V140 cultivation core
        run: node qa/tests/v140-cultivation-core-test.js

      - name: Major systems audit
        run: node qa/tests/v129-major-systems-audit-test.js

      - name: Backend closure
        run: node qa/runners/v140-backend-gates.js closure

      - name: Frontend closure
        run: node qa/runners/v140-frontend-gates.js closure

      - name: Critical runtime syntax
        run: |
          node --check dist/core/reincarnation-progression-v1102.js
          node --check dist/core/cultivation-v140.js
          node --check dist/core/session.js
          node --check app.js
