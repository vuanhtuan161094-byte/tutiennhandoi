name: Apply Luân Hồi Tu Luyện R3

on:
  push:
    branches:
      - feature/reincarnation-cultivation-r3

permissions:
  contents: write

concurrency:
  group: reincarnation-cultivation-r3-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[luan-hoi-r3-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/reincarnation-cultivation-r3
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Apply R3 source patch
        run: node qa/tools/run-reincarnation-cultivation-r3.js

      - name: Dedicated Luân Hồi cultivation test
        run: node qa/tests/reincarnation-cultivation-r3-test.js

      - name: Canonical cultivation core
        run: node qa/tests/v140-cultivation-core-test.js

      - name: Major systems audit
        run: node qa/tests/v129-major-systems-audit-test.js

      - name: Backend fast gate
        run: node qa/runners/v140-backend-gates.js fast

      - name: Frontend fast gate
        run: node qa/runners/v140-frontend-gates.js fast

      - name: Syntax check critical runtime
        run: |
          node --check dist/core/reincarnation-progression-v1102.js
          node --check dist/core/reincarnation-cultivation-r3.js
          node --check dist/core/cultivation-v140.js
          node --check dist/core/session.js
          node --check app.js

      - name: Commit generated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/core/reincarnation-progression-v1102.js dist/core/reincarnation-cultivation-r3.js dist/core/cultivation-v140.js dist/core/session.js qa/tests/v129-major-systems-audit-test.js qa/tests/reincarnation-cultivation-r3-test.js
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'feat: implement Luân Hồi Tu Luyện R3 [luan-hoi-r3-generated]'
          git push origin HEAD:feature/reincarnation-cultivation-r3
