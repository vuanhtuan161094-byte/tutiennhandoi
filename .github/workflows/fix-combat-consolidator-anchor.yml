name: Fix Combat Consolidator Anchor

on:
  push:
    branches: [main]
    paths:
      - 'qa/tools/fix-combat-consolidator-anchor.mjs'
      - '.github/workflows/fix-combat-consolidator-anchor.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair consolidator
        run: node qa/tools/fix-combat-consolidator-anchor.mjs
      - name: Commit repair and remove one-shot plumbing
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved; aborting'; exit 2; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f qa/tools/fix-combat-consolidator-anchor.mjs .github/workflows/fix-combat-consolidator-anchor.yml
          git add qa/tools/consolidate-combat-presentation-ownership-v1.mjs
          git commit -m "fix(combat): repair consolidation anchor"
          git push origin HEAD:main
