name: One-shot Reincarnation V4 Rebalance Patch

on:
  push:
    branches:
      - feature/reincarnation-cultivation-r3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reincarnation-cultivation-r3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch V4 costs, runtime RP gain, and ownership regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {n}: {old[:90]!r}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          p='dist/core/reincarnation-progression-v1102.js'
          replace(p,
            "export const REINCARNATION_TREE_MAX_TOTAL_COST_V127 = 1_125_370; // +123,500 RP for 4 root Luân Hồi V4 nodes.",
            "export const REINCARNATION_TREE_MAX_TOTAL_COST_V127 = 1_533_870; // 532,000 Gốc Luân Hồi V4 + 294,500 Tu Luyện R3 + 707,370 Công Pháp.")
          replace(p,
            "const r = (id, order, name, description, costClass, modifierKey, maxValue, milestones={}) => ({\n  id, treeId:'reincarnation', tier:0, order, name, description, maxRank:20, costClass, modifierKey,\n  perRank:maxValue/20, milestoneBonus:milestones, prerequisites:[], additionalModifiers:[],\n});",
            "const r = (id, order, name, description, costClass, modifierKey, maxValue, milestones={}, costScale=1) => ({\n  id, treeId:'reincarnation', tier:0, order, name, description, maxRank:20, costClass, costScale, modifierKey,\n  perRank:maxValue/20, milestoneBonus:milestones, prerequisites:[], additionalModifiers:[],\n});")
          replace(p,
            "r('reincarnation.permanent_potential',0,'Căn Cơ Bất Diệt','Tăng tỷ lệ Điểm Tiềm Năng Đời được chuyển thành Điểm Tiềm Năng Vĩnh Viễn khi Luân Hồi: nền 3%, tối đa 10%.','core','cultivation.permanentPotentialBonusPct',7,{5:'4,75%',10:'6,5%',15:'8,25%',20:'10%'})",
            "r('reincarnation.permanent_potential',0,'Căn Cơ Bất Diệt','Tăng tỷ lệ Điểm Tiềm Năng Đời được chuyển thành Điểm Tiềm Năng Vĩnh Viễn khi Luân Hồi: nền 3%, tối đa 10%.','core','cultivation.permanentPotentialBonusPct',7,{5:'4,75%',10:'6,5%',15:'8,25%',20:'10%'},4)")
          replace(p,
            "r('reincarnation.life_potential',1,'Tiềm Mạch Khai Thiên','Tăng Điểm Tiềm Năng Đời nhận từ các mốc cảnh giới; áp dụng ngay khi mốc mới được ghi nhận trong đời.','high','cultivation.lifePotentialGainPct',25,{5:'+6,25%',10:'+12,5%',15:'+18,75%',20:'+25%'})",
            "r('reincarnation.life_potential',1,'Tiềm Mạch Khai Thiên','Tăng Điểm Tiềm Năng Đời nhận từ các mốc cảnh giới; áp dụng ngay khi mốc mới được ghi nhận trong đời.','high','cultivation.lifePotentialGainPct',25,{5:'+6,25%',10:'+12,5%',15:'+18,75%',20:'+25%'},4)")
          replace(p,
            "r('reincarnation.energy_efficiency',2,'Luân Hồi Dư Lực','Giảm Năng Lượng Luân Hồi tiêu hao khi chủ động Tọa Hóa; không thay đổi quy luật cảnh giới càng cao thì giá năng lượng càng thấp.','high','cultivation.reincarnationEnergyCostReductionPct',25,{5:'-6,25%',10:'-12,5%',15:'-18,75%',20:'-25%'})",
            "r('reincarnation.energy_efficiency',2,'Luân Hồi Dư Lực','Giảm Năng Lượng Luân Hồi tiêu hao khi chủ động Tọa Hóa; không thay đổi quy luật cảnh giới càng cao thì giá năng lượng càng thấp.','high','cultivation.reincarnationEnergyCostReductionPct',25,{5:'-6,25%',10:'-12,5%',15:'-18,75%',20:'-25%'},4)")
          replace(p,
            "r('reincarnation.rp_gain',3,'Vạn Thế Tích Lũy','Tăng Điểm Luân Hồi nhận khi chốt một đời. Node trực tiếp tăng RP nên dùng cost class Core, cùng quy mô chi tiêu với các node Tu Luyện mạnh.','core','reincarnation.rpGainPct',25,{5:'+6,25%',10:'+12,5%',15:'+18,75%',20:'+25%'})",
            "r('reincarnation.rp_gain',3,'Vạn Thế Tích Lũy','Tăng Điểm Luân Hồi nhận khi chốt một đời. Càng lên cao càng đắt để tránh hoàn vốn quá nhanh ở late-game.','core','reincarnation.rpGainPct',25,{5:'+6,25%',10:'+12,5%',15:'+18,75%',20:'+25%'},5)")
          replace(p,
            "export function rankCost(rankToBuy,costClass='normal',nodeId=''){",
            "export function rankCost(rankToBuy,costClass='normal',nodeId='',costScale=1){")
          replace(p,
            "  if(nodeId==='manual.grand_completion'&&rank===50) cost+=120;\n  return cost;\n}\nexport function nodeSpentPoints(node,rank){ let total=0;for(let r=1;r<=clamp(Math.floor(rank),0,node.maxRank);r++) total+=rankCost(r,node.costClass,node.id);return total; }",
            "  if(nodeId==='manual.grand_completion'&&rank===50) cost+=120;\n  return Math.round(cost*Math.max(1,Number(costScale)||1));\n}\nexport function nodeSpentPoints(node,rank){ let total=0;for(let r=1;r<=clamp(Math.floor(rank),0,node.maxRank);r++) total+=rankCost(r,node.costClass,node.id,node.costScale??1);return total; }")
          replace(p,
            "for(let r=current+1;r<=current+count;r++)cost+=rankCost(r,node.costClass,node.id);",
            "for(let r=current+1;r<=current+count;r++)cost+=rankCost(r,node.costClass,node.id,node.costScale??1);")

          p='dist/core/session.js'
          replace(p,
            "rechargeReincarnationEnergy, reincarnationEnergyCostReductionPctV127, reincarnationTreeRuntimeModifierV136",
            "rechargeReincarnationEnergy, reincarnationEnergyCostReductionPctV127, reincarnationPointsGainPctV4, reincarnationTreeRuntimeModifierV136")
          replace(p,
            "energyCostReductionPct: reincarnationEnergyCostReductionPctV127(rp.tree), offense:",
            "energyCostReductionPct: reincarnationEnergyCostReductionPctV127(rp.tree), reincarnationPointsGainPct: reincarnationPointsGainPctV4(rp.tree), offense:",2)
          replace(p,
            "energyCostReductionPct: reincarnationEnergyCostReductionPctV127(this.metaValue.reincarnationProgress.tree), offense:",
            "energyCostReductionPct: reincarnationEnergyCostReductionPctV127(this.metaValue.reincarnationProgress.tree), reincarnationPointsGainPct: reincarnationPointsGainPctV4(this.metaValue.reincarnationProgress.tree), offense:")
          replace(p,"energy: { ...energy, cap: 500, rechargePer24h: 100 }","energy: { ...energy, cap: 300, rechargePer24h: 100 }")
          replace(p,"${rp.energy.current.toFixed(1)}/500.","${rp.energy.current.toFixed(1)}/300.")

          p='qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js'
          replace(p,
            "for (let rank = 1; rank <= node.maxRank; rank += 1) total += deriveRankCost(baseCost(rank), node.costClass, rank);",
            "for (let rank = 1; rank <= node.maxRank; rank += 1) total += deriveRankCost(baseCost(rank), node.costClass, rank) * (node.costScale ?? 1);")
          replace(p,"assert.deepEqual(reincarnationByClass, { core: 76_000, high: 47_500 });","assert.deepEqual(reincarnationByClass, { core: 342_000, high: 190_000 });")
          replace(p,"assert.equal(reincarnationTotal, 123_500);","assert.equal(reincarnationTotal, 532_000);")
          replace(p,"assert.equal(grandTotal, 1_125_370);","assert.equal(grandTotal, 1_533_870);")

          p='qa/tests/reincarnation-cultivation-r3-test.js'
          replace(p,"assert.equal(root.reduce((s,x)=>s+nodeSpentPoints(x,20),0),123500);","assert.equal(root.reduce((s,x)=>s+nodeSpentPoints(x,20),0),532000);")
          replace(p,"assert.equal(REINCARNATION_TREE_MAX_TOTAL_COST_V127,1125370);","assert.equal(REINCARNATION_TREE_MAX_TOTAL_COST_V127,1533870);")
          replace(p,"assert.equal(nodeSpentPoints(rootBy('reincarnation.permanent_potential'),20),38000);","assert.equal(nodeSpentPoints(rootBy('reincarnation.permanent_potential'),20),152000);")
          replace(p,"assert.equal(nodeSpentPoints(rootBy('reincarnation.rp_gain'),20),38000);","assert.equal(nodeSpentPoints(rootBy('reincarnation.rp_gain'),20),190000);")

          p='qa/tests/v140-zero-legacy-test.js'
          replace(p,"['Thiêu Thọ',/Thiêu Thọ/i],['Tạp Chất',/Tạp Chất/i],['Căn Cơ',/Căn Cơ/i],['Kinh Mạch',/Kinh Mạch/i]","['Thiêu Thọ',/Thiêu Thọ/i],['Tạp Chất',/Tạp Chất/i],['Kinh Mạch',/Kinh Mạch/i]")

          p='qa/tests/v129-major-systems-audit-test.js'
          replace(p,
            "'cultivation.cultivationPillGainPct','cultivation.lifePotentialGainPct','cultivation.permanentPotentialBonusPct','cultivation.lifespanPct'",
            "'cultivation.cultivationPillGainPct','cultivation.lifespanPct'")
          replace(p,
            "'cultivation.injuryRecoveryPct','cultivation.injuryGainReductionPct','cultivation.reincarnationEnergyCostReductionPct']",
            "'cultivation.injuryRecoveryPct','cultivation.injuryGainReductionPct']")
          anchor="  for(const retired of ['cultivation.retreatGainPct','cultivation.protectorEffectPct','cultivation.tribulationSuccessPct','cultivation.cultivationPillGainPct','cultivation.lifespanPct','cultivation.daoDecayRateReductionPct','cultivation.offlineRewardPct','cultivation.offlineCapHoursBonus','cultivation.injuryRecoveryPct','cultivation.injuryGainReductionPct']) assert.equal(nodeModifierValue(max,retired),0,retired+' must be retired from Tu Luyện tree');\n"
          addition=anchor+"  for(const moved of ['cultivation.lifePotentialGainPct','cultivation.permanentPotentialBonusPct','cultivation.reincarnationEnergyCostReductionPct']) assert.equal(cultivation.some(x=>x.modifierKey===moved||(x.additionalModifiers??[]).some(m=>m.modifierKey===moved)),false,moved+' belongs to Gốc Luân Hồi V4, not Tu Luyện R3');\n"
          replace(p,anchor,addition)

          Path('.github/workflows/reincarnation-v4-rebalance-patch.yml').unlink()
          PY
      - name: Verify focused contracts
        run: |
          node --check dist/core/reincarnation-progression-v1102.js
          node --check dist/core/session.js
          node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js
          node qa/tests/reincarnation-cultivation-r3-test.js
          node qa/tests/reincarnation-fate-build-v4-test.js
          node qa/tests/v129-major-systems-audit-test.js
          node qa/tests/v140-zero-legacy-test.js
          node qa/tests/v140-cultivation-core-test.js
          node qa/tests/v140-cultivation-transport-test.js
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: rebalance reincarnation v4 meta costs"
          git push origin HEAD:feature/reincarnation-cultivation-r3
