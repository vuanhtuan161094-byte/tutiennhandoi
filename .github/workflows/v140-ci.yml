name: Canonical Closure QA

on:
  push:
    branches:
      - main
      - 'closure/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Codebase health scan
        continue-on-error: true
        run: node qa/tools/codebase-health.js

      - name: Locked baseline V140-V151
        run: |
          set -euo pipefail
          node qa/tests/v140-cultivation-core-test.js
          node qa/tests/v140-cultivation-transport-test.js
          node qa/tests/v140-zero-legacy-test.js
          node qa/tests/v141-hunt-cultivation-closure-test.js
          node qa/runners/v142-equipment-hunt-gate.js
          node qa/tests/v145-spiritual-root-redesign-test.js
          node qa/tests/v145-spiritual-root-runtime-test.js
          node qa/tests/v145-spiritual-root-realm-origin-test.js
          node qa/tests/v145-spiritual-root-ui-test.js
          node qa/tests/v146-alchemy-core-test.js
          node qa/tests/v146-alchemy-source-runtime-test.js
          node qa/tests/v146-alchemy-closure-test.js
          node qa/tests/v148-confidant-v129-balance-test.js
          node qa/tests/v149-artifact-core-test.js
          node qa/tests/v149-artifact-production-test.js
          node qa/tests/v149-artifact-combo-test.js
          node qa/tests/v149-artifact-v129-balance-test.js
          node qa/tests/v150-artifact-no-baoqi-test.js
          node qa/tests/v151-relic-production-test.js
          node qa/tests/v151-relic-v129-balance-test.js

      - name: Locked authorities V152-V159
        run: |
          set -euo pipefail
          node qa/tests/v127-manual-progression-test.js
          node qa/tests/v127-manual-combat-consumer-test.js
          node qa/tests/reincarnation-cultivation-r3-test.js
          node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js
          node qa/tests/v127-clone-authority-migration-test.js
          node qa/tests/v129-major-systems-audit-test.js
          node qa/tests/v99-dongfu-production-test.js
          node qa/tests/v99-dongfu-transport-test.js
          node qa/tests/v129-endgame-continuity-structural-test.js
          node qa/tests/v158-player-journey-integration-test.js
          node qa/tests/v159-economy-pacing-variety-test.js

      - name: V160 locked audit evidence
        run: |
          set -euo pipefail
          node qa/tests/v160-full-life-economy-pacing-test.js
          node qa/tests/v160-acquisition-economy-test.js
          node qa/tests/v160-full-life-audit-closure-test.js

      - name: V161 phase gates
        run: |
          set -euo pipefail
          node qa/tests/v161-retreat-contract-audit-test.js
          node qa/tests/v161-early-pacing-test.js
          node qa/tests/v161-bound-jade-spend-model-test.js
          node qa/tests/v161-manual-acquisition-pacing-test.js
          node qa/tests/v161-spiritual-root-hunt-pacing-test.js

      - name: Backend fast gate
        run: node qa/runners/v140-backend-gates.js fast

      - name: Frontend fast gate
        run: node qa/runners/v140-frontend-gates.js fast

      - name: Backend closure
        run: node qa/runners/v140-backend-gates.js closure

      - name: Frontend closure
        run: node qa/runners/v140-frontend-gates.js closure
