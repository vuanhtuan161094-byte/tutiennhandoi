name: V140 Canonical QA

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v140-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Codebase health scan
        continue-on-error: true
        run: node qa/tools/codebase-health.js

      - name: V140 cultivation core
        run: node qa/tests/v140-cultivation-core-test.js

      - name: V140 cultivation transport
        run: node qa/tests/v140-cultivation-transport-test.js

      - name: V140 zero legacy
        run: node qa/tests/v140-zero-legacy-test.js

      - name: V141 Hunt x Cultivation closure
        run: node qa/tests/v141-hunt-cultivation-closure-test.js

      - name: V142 Equipment x Hunt
        run: node qa/runners/v142-equipment-hunt-gate.js

      - name: V145 infinite Spiritual Root core
        run: node qa/tests/v145-spiritual-root-redesign-test.js

      - name: V145 Spiritual Root source sink runtime
        run: node qa/tests/v145-spiritual-root-runtime-test.js

      - name: V145 Spiritual Root realm origin
        run: node qa/tests/v145-spiritual-root-realm-origin-test.js

      - name: V145 Spiritual Root UI transport
        run: node qa/tests/v145-spiritual-root-ui-test.js

      - name: V146 Alchemy core
        run: node qa/tests/v146-alchemy-core-test.js

      - name: V146 Alchemy source runtime
        run: node qa/tests/v146-alchemy-source-runtime-test.js

      - name: V146 Alchemy production closure
        run: node qa/tests/v146-alchemy-closure-test.js

      - name: V148 Confidant x V129 balance
        run: node qa/tests/v148-confidant-v129-balance-test.js

      - name: V149 Artifact core
        run: node qa/tests/v149-artifact-core-test.js

      - name: V149 Artifact production
        run: node qa/tests/v149-artifact-production-test.js

      - name: V149 Artifact combo combat
        run: node qa/tests/v149-artifact-combo-test.js

      - name: V149 Artifact x V129 balance
        run: node qa/tests/v149-artifact-v129-balance-test.js

      - name: V150 Artifact no-resource contract
        run: node qa/tests/v150-artifact-no-baoqi-test.js

      - name: V151 Relic production combat
        run: node qa/tests/v151-relic-production-test.js

      - name: V151 Relic x V129 balance
        run: node qa/tests/v151-relic-v129-balance-test.js

      - name: V152 Công Pháp contract
        run: |
          node qa/tests/v127-manual-progression-test.js
          node qa/tests/v127-manual-combat-consumer-test.js

      - name: V153 Luân Hồi contract
        run: |
          node qa/tests/reincarnation-cultivation-r3-test.js
          node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js

      - name: V154 Phân Thân authority
        run: node qa/tests/v127-clone-authority-migration-test.js

      - name: V155 Skills and Tâm Pháp authority
        run: node qa/tests/v129-major-systems-audit-test.js

      - name: V156 Động Phủ production
        run: |
          node qa/tests/v99-dongfu-production-test.js
          node qa/tests/v99-dongfu-transport-test.js

      - name: V157 Endgame continuity
        run: node qa/tests/v129-endgame-continuity-structural-test.js

      - name: V158 Full player journey integration
        run: node qa/tests/v158-player-journey-integration-test.js

      - name: Backend fast gate
        run: node qa/runners/v140-backend-gates.js fast

      - name: Frontend fast gate
        run: node qa/runners/v140-frontend-gates.js fast

      - name: Backend closure
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
        run: node qa/runners/v140-backend-gates.js closure

      - name: Frontend closure
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
        run: node qa/runners/v140-frontend-gates.js closure
