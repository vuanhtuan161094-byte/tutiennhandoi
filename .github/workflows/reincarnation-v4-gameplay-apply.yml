name: Reincarnation V4 Gameplay Apply
on:
  push:
    branches: [feature/reincarnation-cultivation-r3]
    paths:
      - 'qa/reincarnation-v4-gameplay-patch.py'
      - '.github/workflows/reincarnation-v4-gameplay-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reincarnation-cultivation-r3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden staged patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/reincarnation-v4-gameplay-patch.py')
          s=p.read_text()
          # Exact tutorial/currency anchors only; never replace generic '+ 6/10/8'.
          s=s.replace('s=s.replace("+ 6;","+ this.fateSpiritStoneGainV4(6);",1)\ns=s.replace("+ 10;","+ this.fateSpiritStoneGainV4(10);",1)\ns=s.replace("+ 8;","+ this.fateSpiritStoneGainV4(8);",1)', '''s=rep(s,"this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + 6;","this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + this.fateSpiritStoneGainV4(6);",'tutorial stones 6')
          s=rep(s,"this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + 10;","this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + this.fateSpiritStoneGainV4(10);",'tutorial stones 10')
          s=rep(s,"this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + 8;","this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + this.fateSpiritStoneGainV4(8);",'tutorial stones 8')''')
          # Chiến Mệnh owns outgoing damage, not Attack; avoid double-dipping through defenseFactor.
          old="return { ...stats, attack: Math.max(0, Number(stats.attack) || 0) * (1 + damagePct / 100), defense: Math.max(0, Number(stats.defense) || 0) * (1 + defensePct / 100), physique, maxHp, damageReductionPct: combineStatPctV129('damageReductionPct', stats.damageReductionPct ?? 0, damageReductionPct) };"
          new="return { ...stats, attack: Math.max(0, Number(stats.attack) || 0), defense: Math.max(0, Number(stats.defense) || 0) * (1 + defensePct / 100), physique, maxHp, damageReductionPct: combineStatPctV129('damageReductionPct', stats.damageReductionPct ?? 0, damageReductionPct) };"
          if old not in s: raise SystemExit('missing Fate stat semantic anchor')
          s=s.replace(old,new,1)
          old="function fateBossDamageMultiplierV4(source,target){ const pct=Math.max(0,Number(source?.combatBuildV117?.fateV4?.bossDamagePct)||0); const boss=target?.tags?.some(tag=>['boss','dungeonguardian','bosslike'].includes(String(tag).toLowerCase())); return boss?1+pct/100:1; }"
          new="function fateOutgoingDamageMultiplierV4(source,target){ const fate=source?.combatBuildV117?.fateV4??{},general=Math.max(0,Number(fate.damagePct)||0),bossPct=Math.max(0,Number(fate.bossDamagePct)||0),boss=target?.tags?.some(tag=>['boss','dungeonguardian','bosslike'].includes(String(tag).toLowerCase())); return (1+general/100)*(boss?1+bossPct/100:1); }"
          if old not in s: raise SystemExit('missing Fate boss helper anchor')
          s=s.replace(old,new,1).replace('fateBossDamageMultiplierV4(source,target)','fateOutgoingDamageMultiplierV4(source,target)')
          # Character test: damage stays a combat modifier, while Thể is materialized in stats.
          s=s.replace("assert(b.stats.attack>a.stats.attack*1.19); assert(combatMaxHp(b.stats)>combatMaxHp(a.stats)*1.27);", "assert.equal(b.combatBuildV117.fateV4.damagePct,20); assert(combatMaxHp(b.stats)>combatMaxHp(a.stats)*1.27);")
          # Add a generic CombatKernel damage test before the boss-specific test.
          marker="test('Boss Damage của Chiến Mệnh is consumed inside CombatKernel V2',()=>{"
          generic="""test('Damage của Chiến Mệnh is consumed as real outgoing damage inside CombatKernel V2',()=>{\n  const player={...structuredClone(playableMortalCultivator),id:'p',stats:{...playableMortalCultivator.stats,attack:500},combatBuildV117:{fateV4:{damagePct:0}}};\n  const boosted=structuredClone(player); boosted.combatBuildV117.fateV4.damagePct=20;\n  const target={...structuredClone(heavySwordCultivator),id:'t',stats:{...heavySwordCultivator.stats,maxHp:20000,physique:1000}};\n  const a=runCombatKernelV2({mode:'realtime',registry,seed:8181,entities:[player,target],maxDuration:8}).battle;\n  const b=runCombatKernelV2({mode:'realtime',registry,seed:8181,entities:[boosted,target],maxDuration:8}).battle;\n  assert(b.finalState.t.hp<a.finalState.t.hp,`${a.finalState.t.hp} -> ${b.finalState.t.hp}`);\n});\n\n"""
          if marker not in s: raise SystemExit('missing combat test marker')
          s=s.replace(marker,generic+marker,1)
          # Personal Power must recognize a real damage modifier without pretending it is Attack.
          insert="""\n# 2b) Personal Power: score the real Fate outgoing-damage modifier.\np='dist/core/personal-power.js'; s=read(p)\ns=rep(s,\n\"    const offense = Math.sqrt(safe(s.attack)) * 10\",\n\"    const fateDamageMultiplierV4=1+Math.max(0,Number(entity?.combatBuildV117?.fateV4?.damagePct)||0)/100;\\n    const offense = Math.sqrt(safe(s.attack)) * 10 * fateDamageMultiplierV4\",'personal power fate damage')\nwrite(p,s)\n\n"""
          anchor="# 3) Cultivation: Tu Mệnh applies to self-cultivation. Keep pure V140 provenance."
          if anchor not in s: raise SystemExit('missing personal power insertion anchor')
          s=s.replace(anchor,insert+anchor,1)
          p.write_text(s)
          PY
      - name: Apply V4 gameplay patch
        run: python3 qa/reincarnation-v4-gameplay-patch.py
      - name: Syntax and dedicated gates
        run: |
          node --check dist/core/reincarnation-progression-v1102.js
          node --check dist/core/character.js
          node --check dist/core/cultivation-v140.js
          node --check dist/core/combat.js
          node --check dist/core/personal-power.js
          node --check dist/core/session.js
          node qa/tests/reincarnation-v4-lifecycle-contract-test.js
          node qa/tests/reincarnation-v4-gameplay-balance-test.js
          node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js
          node qa/tests/reincarnation-cultivation-r3-test.js
          node qa/tests/reincarnation-fate-build-v4-test.js
          node qa/tests/v140-cultivation-core-test.js
          node qa/tests/v140-cultivation-transport-test.js
          node qa/tests/v140-zero-legacy-test.js
      - name: Backend fast
        run: node qa/runners/v140-backend-gates.js fast
      - name: Frontend fast
        run: node qa/runners/v140-frontend-gates.js fast
      - name: Backend closure
        run: node qa/runners/v140-backend-gates.js closure
      - name: Frontend closure
        run: node qa/runners/v140-frontend-gates.js closure
      - name: Commit clean runtime
        run: |
          rm -f qa/reincarnation-v4-gameplay-patch.py
          rm -f .github/workflows/reincarnation-v4-gameplay-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire reincarnation v4 fate rp and potential"
          git push origin HEAD:feature/reincarnation-cultivation-r3
