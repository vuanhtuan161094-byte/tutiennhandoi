name: V180 Apply Combat Portrait Geometry

on:
  push:
    branches:
      - main
    paths:
      - 'qa/tools/apply-v180-combat-portrait-geometry.mjs'
      - '.github/workflows/v180-apply-hunt-time-reward.yml'

permissions:
  contents: write

concurrency:
  group: v180-combat-portrait-geometry
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply V180 unified portrait geometry') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply unified portrait geometry
        run: node qa/tools/apply-v180-combat-portrait-geometry.mjs

      - name: Commit presentation patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ui-combat-camera-polish.css; then
            echo 'No change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-combat-camera-polish.css
          git commit -m 'fix(ui): apply V180 unified portrait geometry'
          git push origin HEAD:main
