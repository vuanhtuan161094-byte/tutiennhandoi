name: V180 Apply Hunt Time Reward Authority

on:
  push:
    branches:
      - main
    paths:
      - 'qa/tools/apply-v180-hunt-time-reward-authority.mjs'
      - '.github/workflows/v180-apply-hunt-time-reward.yml'

permissions:
  contents: write

concurrency:
  group: v180-hunt-time-reward-authority
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply V180 Hunt time reward authority') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply V180 migration
        run: node qa/tools/apply-v180-hunt-time-reward-authority.mjs

      - name: Verify syntax
        run: node --check dist/core/session.js

      - name: Commit canonical authority patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist/core/session.js; then
            echo 'No change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/core/session.js
          git commit -m 'fix(hunt): apply V180 Hunt time reward authority'
          git push origin HEAD:main
