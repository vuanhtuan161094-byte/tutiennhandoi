name: V142 Combat Live Patch

on:
  push:
    branches:
      - feature/v142-equipment-hunt
    paths:
      - 'qa/tools/apply-v142-combat-live-patch.mjs'
      - '.github/workflows/v142-combat-live-patch.yml'

permissions:
  contents: write

jobs:
  patch-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v142-equipment-hunt
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply V142 combat live patch
        run: node qa/tools/apply-v142-combat-live-patch.mjs

      - name: Verify syntax and live combat effects
        run: |
          node --check dist/core/equipment-v142.js
          node --check dist/core/equipment.js
          node --check dist/core/combat.js
          node qa/tests/v142-equipment-combat-live-test.js
          node qa/runners/v142-equipment-hunt-gate.js

      - name: Commit patched runtime
        run: |
          if git diff --quiet; then
            echo "No combat runtime changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/core/equipment-v142.js dist/core/equipment.js dist/core/combat.js
          git commit -m "feat(v142): make equipment set bonuses live in combat"
          git push origin HEAD:feature/v142-equipment-hunt
