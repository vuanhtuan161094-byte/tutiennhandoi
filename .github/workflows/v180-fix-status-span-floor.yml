name: V180 Fix Status Span Floor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v180-fix-status-span-floor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch canonical portrait status text floor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ui-combat-camera-polish.css')
          s=p.read_text(encoding='utf-8')
          needle='  body[data-game-screen="hunt"] .huntv2-status-tray .status>small,\n'
          add='  body[data-game-screen="hunt"] .huntv2-status-tray .status>span,\n'
          if add not in s:
              if needle not in s:
                  raise SystemExit('target selector not found')
              s=s.replace(needle, needle+add, 1)
              p.write_text(s, encoding='utf-8')
          PY
          grep -F '.huntv2-status-tray .status>span,' ui-combat-camera-polish.css
      - name: Self-clean and commit patch
        shell: bash
        run: |
          git rm .github/workflows/v180-fix-status-span-floor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-combat-camera-polish.css
          git commit -m 'fix(ui): include status span in portrait text floor'
          git push origin HEAD:main
