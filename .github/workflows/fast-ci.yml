name: Fast QA

on:
  push:
    branches:
      - 'feature/**'
      - 'refactor/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: V161 completed phase gates B1-B4
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"; shift
            local log
            log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              echo "PASS · $label"
            else
              echo "FAIL · $label"
              cat "$log"
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          }
          run_quiet "V161 B1 retreat" node qa/tests/v161-retreat-contract-audit-test.js
          run_quiet "V161 B2 early pacing" node qa/tests/v161-early-pacing-test.js
          run_quiet "V161 B3 Bound Jade" node qa/tests/v161-bound-jade-spend-model-test.js
          run_quiet "V161 B4 manual pacing" node qa/tests/v161-manual-acquisition-pacing-test.js

      - name: V161 active phase B5
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if node qa/tests/v161-spiritual-root-hunt-pacing-test.js >"$log" 2>&1; then
            echo "PASS · V161 B5 Spiritual Root × Hunt"
          else
            echo "FAIL · V161 B5 Spiritual Root × Hunt"
            cat "$log"
            rm -f "$log"
            exit 1
          fi
          rm -f "$log"

      - name: Backend fast gate
        run: node qa/runners/v140-backend-gates.js fast

      - name: Frontend fast gate
        run: node qa/runners/v140-frontend-gates.js fast
