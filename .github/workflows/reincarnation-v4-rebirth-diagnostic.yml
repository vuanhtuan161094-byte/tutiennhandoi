name: Reincarnation V4 Rebirth Diagnostic

on:
  push:
    branches:
      - feature/reincarnation-cultivation-r3

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reincarnation-cultivation-r3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize staged lifecycle source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/reincarnation-v4-lifecycle-apply2.yml').read_text().splitlines()
          marker='      - name: Extract and apply lifecycle patch'
          start=lines.index(marker)
          run_i=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')+1
          end=next(i for i in range(run_i,len(lines)) if lines[i].startswith('      - name: Verify lifecycle closure'))
          body=[]
          for line in lines[run_i:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-v4.sh').write_text('\n'.join(body)+'\n')
          PY
          bash /tmp/apply-v4.sh
      - name: Print reincarnate failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/tests/v129-gameplay-consistency-test.js')
          s=p.read_text()
          needle="  const rebirth = api.reincarnate({});\n  assert.equal(rebirth.ok, true);"
          repl="  const rebirth = api.reincarnate({});\n  console.log('V4_REBIRTH_DIAGNOSTIC', JSON.stringify(rebirth));\n  assert.equal(rebirth.ok, true);"
          if needle not in s: raise SystemExit('diagnostic anchor missing')
          p.write_text(s.replace(needle,repl,1))
          PY
          node qa/tests/v129-gameplay-consistency-test.js
