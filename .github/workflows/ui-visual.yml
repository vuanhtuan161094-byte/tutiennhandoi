name: UI Visual Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'standalone-entry.js'
      - 'standalone-runtime.js'
      - 'styles.css'
      - 'ui-*.css'
      - 'combat-v2.css'
      - 'assets/**'
      - 'modules/**'
      - 'dist/**'
      - 'web/server.mjs'
      - 'qa/visual/**'
      - 'qa/tests/ui-visual-workflow-contract-test.js'
      - 'qa/tests/ui-frontend-home-v2-art-direction-test.js'
      - 'qa/runners/v140-frontend-gates.js'
      - '.github/workflows/ui-visual.yml'

permissions:
  contents: read

concurrency:
  group: ui-visual-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: cmd

jobs:
  runtime-visual-proof:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Expose Git Bash
        run: |
          @echo off
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: Locate installed Chrome
        run: |
          @echo off
          set "CHROME="
          if exist "%ProgramFiles%\Google\Chrome\Application\chrome.exe" set "CHROME=%ProgramFiles%\Google\Chrome\Application\chrome.exe"
          if not defined CHROME if exist "%ProgramFiles(x86)%\Google\Chrome\Application\chrome.exe" set "CHROME=%ProgramFiles(x86)%\Google\Chrome\Application\chrome.exe"
          if not defined CHROME for /f "tokens=2,*" %%A in ('reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe" /ve 2^>nul ^| find "REG_SZ"') do set "CHROME=%%B"
          if not defined CHROME (
            echo Chrome executable was not found for the self-hosted runner.
            exit /b 1
          )
          echo Chrome found at: %CHROME%
          echo CHROME_PATH=%CHROME%>>"%GITHUB_ENV%"

      - name: Verify visual workflow contract
        run: node qa/tests/ui-visual-workflow-contract-test.js

      - name: Start canonical game server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui-visual
          node web/server.mjs 4173 127.0.0.1 > artifacts/ui-visual/server.log 2>&1 &
          echo $! > artifacts/ui-visual/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/__tutien_launcher_health > artifacts/ui-visual/health.json; then
              exit 0
            fi
            sleep 0.5
          done
          cat artifacts/ui-visual/server.log
          exit 1

      - name: Capture real runtime visual proof
        env:
          TUTIEN_VISUAL_SEED: '20260913'
          TUTIEN_VISUAL_REALM: '10'
        run: node qa/visual/capture-runtime-ui.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual

      - name: Capture Combat runtime proof 390x844
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if node qa/visual/capture-combat-runtime.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual --cdp-port 9223 2>&1 | tee "$log"; then
            rm -f "$log"
            exit 0
          fi
          if ! grep -Fq 'has no measured camera impulse' "$log"; then
            rm -f "$log"
            exit 1
          fi
          echo 'RETRY · transient shake telemetry sampling only · 390x844'
          rm -f "$log"
          node qa/visual/capture-combat-runtime.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual --cdp-port 9223

      - name: Capture Combat runtime proof 360x800
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if node qa/visual/capture-combat-runtime.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual/compact --cdp-port 9224 --width 360 --height 800 2>&1 | tee "$log"; then
            rm -f "$log"
            exit 0
          fi
          if ! grep -Fq 'has no measured camera impulse' "$log"; then
            rm -f "$log"
            exit 1
          fi
          echo 'RETRY · transient shake telemetry sampling only · 360x800'
          rm -f "$log"
          node qa/visual/capture-combat-runtime.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual/compact --cdp-port 9224 --width 360 --height 800

      - name: Capture Combat runtime proof 412x915
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if node qa/visual/capture-combat-runtime.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual/portrait-412 --cdp-port 9225 --width 412 --height 915 2>&1 | tee "$log"; then
            rm -f "$log"
            exit 0
          fi
          if ! grep -Fq 'has no measured camera impulse' "$log"; then
            rm -f "$log"
            exit 1
          fi
          echo 'RETRY · transient shake telemetry sampling only · 412x915'
          rm -f "$log"
          node qa/visual/capture-combat-runtime.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual/portrait-412 --cdp-port 9225 --width 412 --height 915

      - name: Capture Combat runtime proof 430x932
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if node qa/visual/capture-combat-runtime.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual/portrait-430 --cdp-port 9226 --width 430 --height 932 2>&1 | tee "$log"; then
            rm -f "$log"
            exit 0
          fi
          if ! grep -Fq 'has no measured camera impulse' "$log"; then
            rm -f "$log"
            exit 1
          fi
          echo 'RETRY · transient shake telemetry sampling only · 430x932'
          rm -f "$log"
          node qa/visual/capture-combat-runtime.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual/portrait-430 --cdp-port 9226 --width 430 --height 932

      - name: Validate proof files
        shell: bash
        run: |
          set -euo pipefail
          cp docs/ui/reference/REFERENCE_COMBAT_TARGET_20260905.png artifacts/ui-visual/combat-target-reference.png
          test -s artifacts/ui-visual/home-hud-390x844.png
          test -s artifacts/ui-visual/home-hud-412x915.png
          test -s artifacts/ui-visual/character-baseline-390x844.png
          test -s artifacts/ui-visual/combat-target-reference.png
          test -s artifacts/ui-visual/manifest.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('artifacts/ui-visual/manifest.json','utf8'));if(m.mockOrReconstruction!==false||m.screens?.length!==3)process.exit(1);console.log('VISUAL MANIFEST PASS ·',m.screens.map(x=>x.file).join(', '));"

          for spec in "artifacts/ui-visual|390x844" "artifacts/ui-visual/compact|360x800" "artifacts/ui-visual/portrait-412|412x915" "artifacts/ui-visual/portrait-430|430x932"; do
            dir="${spec%%|*}"
            viewport="${spec##*|}"
            test -s "$dir/combat-runtime-$viewport.png"
            test -s "$dir/combat-runtime-stress-$viewport.png"
            test -s "$dir/combat-runtime-action-$viewport.png"
            test -s "$dir/combat-runtime-metrics.json"
            test -s "$dir/combat-runtime-stress-metrics.json"
            test -s "$dir/combat-showcase-$viewport-metrics.json"
            test -s "$dir/combat-shake-metrics.json"
            for scene in 01-clean 02-status-stress 04-damage-stress 06-full-chaos; do
              test -s "$dir/${scene}-$viewport.png"
            done
            test -s "$dir/04-damage-stress-normal-$viewport.png"
            for skill in 01 02 03 04 05 06 07; do
              test -s "$dir/03-skill-cast-${skill}-cast-$viewport.png"
              test -s "$dir/03-skill-cast-${skill}-impact-$viewport.png"
            done
            for state in near-break broken recovery; do
              test -s "$dir/05-boss-break-${state}-$viewport.png"
            done
            for kind in light heavy critical ultimate boss; do
              for phase in before impact peak settled; do
                test -s "$dir/screen-shake-${kind}-${phase}-$viewport.png"
              done
            done
          done

          node <<'NODE'
          const fs=require('fs');
          const targets=[
            ['artifacts/ui-visual','390x844'],
            ['artifacts/ui-visual/compact','360x800'],
            ['artifacts/ui-visual/portrait-412','412x915'],
            ['artifacts/ui-visual/portrait-430','430x932'],
          ];
          for(const [dir,label] of targets){
            const base=JSON.parse(fs.readFileSync(`${dir}/combat-runtime-metrics.json`,'utf8'));
            const layout=base.combatLayout||{};
            if(!base.hasCombat||!base.hasPlayerHud||!base.hasEnemyHud||!base.hasEnemyContext||base.hasHorizontalOverflow||base.skillCount!==7||base.visibleText.length>0||layout.supportCount!==3||layout.supportYSpread>14||layout.playerHudTop>=310)throw new Error(`${label} combat layout/legibility failed`);
            const stress=JSON.parse(fs.readFileSync(`${dir}/combat-runtime-stress-metrics.json`,'utf8'));
            const s=stress.statusStress||{};
            if(stress.hasHorizontalOverflow||s.player?.visible<4||s.enemy?.visible<4||!s.player?.more||!s.enemy?.more||!String(s.enemy?.mark||'').includes('6/6'))throw new Error(`${label} status stress failed`);
            const showcase=JSON.parse(fs.readFileSync(`${dir}/combat-showcase-${label}-metrics.json`,'utf8'));
            if(showcase.mockOrReconstruction!==false||showcase.scenes?.length!==6||showcase.skills?.length!==7||showcase.shake?.length!==5)throw new Error(`${label} showcase manifest incomplete`);
            if(!showcase.shake.every(frame=>frame.neutral&&['before','impact','peak','settled'].every(phase=>frame[phase]?.file)))throw new Error(`${label} shake frame manifest incomplete`);
            if(!showcase.shake.every(frame=>Math.max(Math.abs(frame.impact?.state?.cameraX||0),Math.abs(frame.impact?.state?.cameraY||0),Math.abs(frame.peak?.state?.cameraX||0),Math.abs(frame.peak?.state?.cameraY||0))>0.05))throw new Error(`${label} shake camera impulse missing`);
            console.log(`${label} COMBAT REVIEW PASS · skills=${showcase.skills.length} · scenes=${showcase.scenes.length} · shake=${showcase.shake.length}`);
          }
          NODE

      - name: Upload exact-SHA runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-${{ github.sha }}
          path: artifacts/ui-visual/
          if-no-files-found: error
          retention-days: 14
