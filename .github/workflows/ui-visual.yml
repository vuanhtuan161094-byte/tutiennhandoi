name: UI Visual Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'standalone-entry.js'
      - 'standalone-runtime.js'
      - 'styles.css'
      - 'ui-*.css'
      - 'combat-v2.css'
      - 'assets/**'
      - 'modules/**'
      - 'dist/**'
      - 'web/server.mjs'
      - 'qa/visual/**'
      - 'qa/tests/ui-visual-workflow-contract-test.js'
      - 'qa/tests/ui-frontend-home-v2-art-direction-test.js'
      - 'qa/runners/v140-frontend-gates.js'
      - '.github/workflows/ui-visual.yml'

permissions:
  contents: read

concurrency:
  group: ui-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify visual workflow contract
        run: node qa/tests/ui-visual-workflow-contract-test.js

      - name: Start canonical game server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui-visual
          node web/server.mjs 4173 127.0.0.1 > artifacts/ui-visual/server.log 2>&1 &
          echo $! > artifacts/ui-visual/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/__tutien_launcher_health > artifacts/ui-visual/health.json; then
              exit 0
            fi
            sleep 0.5
          done
          cat artifacts/ui-visual/server.log
          exit 1

      - name: Capture real runtime visual proof
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          TUTIEN_VISUAL_SEED: '20260913'
          TUTIEN_VISUAL_REALM: '10'
        run: node qa/visual/capture-runtime-ui.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual

      - name: Capture Combat runtime proof
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node qa/visual/capture-combat-runtime.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual --cdp-port 9223

      - name: Capture compact Combat runtime proof
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node qa/visual/capture-combat-runtime.mjs --base http://127.0.0.1:4173 --out artifacts/ui-visual/compact --cdp-port 9224 --width 360 --height 800

      - name: Validate proof files
        shell: bash
        run: |
          set -euo pipefail
          cp docs/ui/reference/REFERENCE_COMBAT_TARGET_20260905.png artifacts/ui-visual/combat-target-reference.png
          test -s artifacts/ui-visual/home-hud-390x844.png
          test -s artifacts/ui-visual/home-hud-412x915.png
          test -s artifacts/ui-visual/character-baseline-390x844.png
          test -s artifacts/ui-visual/combat-runtime-390x844.png
          test -s artifacts/ui-visual/combat-runtime-stress-390x844.png
          test -s artifacts/ui-visual/combat-runtime-action-390x844.png
          test -s artifacts/ui-visual/compact/combat-runtime-360x800.png
          test -s artifacts/ui-visual/compact/combat-runtime-stress-360x800.png
          test -s artifacts/ui-visual/compact/combat-runtime-action-360x800.png
          test -s artifacts/ui-visual/combat-runtime-metrics.json
          test -s artifacts/ui-visual/combat-runtime-stress-metrics.json
          test -s artifacts/ui-visual/combat-target-reference.png
          test -s artifacts/ui-visual/manifest.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('artifacts/ui-visual/manifest.json','utf8'));if(m.mockOrReconstruction!==false||m.screens?.length!==3)process.exit(1);console.log('VISUAL MANIFEST PASS ·',m.screens.map(x=>x.file).join(', '));"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('artifacts/ui-visual/combat-runtime-metrics.json','utf8'));const l=m.combatLayout||{};if(!m.hasCombat||!m.hasPlayerHud||!m.hasEnemyHud||!m.hasEnemyContext||m.hasHorizontalOverflow||m.skillCount!==7||m.visibleText.length>0||l.supportCount!==3||l.supportYSpread>14||l.playerHudTop>=310)process.exit(1);console.log('COMBAT VISUAL METRICS PASS · skills='+m.skillCount+' · supportYSpread='+l.supportYSpread+' · playerHudTop='+l.playerHudTop);"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('artifacts/ui-visual/combat-runtime-stress-metrics.json','utf8'));const s=m.statusStress||{};if(m.hasHorizontalOverflow||s.player?.visible<4||s.enemy?.visible<4||!s.player?.more||!s.enemy?.more||!String(s.mark||'').includes('6/6'))process.exit(1);console.log('COMBAT STATUS STRESS PASS · player='+s.player.visible+' enemy='+s.enemy.visible+' mark='+s.mark);"

      - name: Upload exact-SHA runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-${{ github.sha }}
          path: artifacts/ui-visual/
          if-no-files-found: error
          retention-days: 14
