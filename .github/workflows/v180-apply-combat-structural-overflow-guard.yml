name: V180 Apply Combat Structural Overflow Guard

on:
  push:
    branches:
      - main
    paths:
      - 'qa/tools/apply-v180-combat-structural-overflow-guard.mjs'
      - '.github/workflows/v180-apply-combat-structural-overflow-guard.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply V180 structural combat overflow guard') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply structural overflow guard
        run: node qa/tools/apply-v180-combat-structural-overflow-guard.mjs
      - name: Verify syntax
        run: node --check qa/visual/capture-combat-runtime.mjs
      - name: Commit canonical guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/visual/capture-combat-runtime.mjs
          git commit -m 'test(ui): apply V180 structural combat overflow guard'
          git push origin HEAD:main
