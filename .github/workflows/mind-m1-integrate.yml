name: Mind M1 guarded integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mind-m1-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded M1 patch
        shell: cmd
        run: |
          node --check tools\mind-m1-integrate.mjs
          node tools\mind-m1-integrate.mjs
          node --check dist\core\mind-dao-v2-runtime.js
          node --check dist\core\battle-dao-v2-runtime.js
          node --check dist\core\combat.js

      - name: Targeted Mind correctness gates
        shell: cmd
        run: |
          node qa\tests\mind-dao-m1-authority-test.js
          node qa\tests\mind-dao-production-contract-test.js

      - name: Locked Dao smoke gates
        shell: cmd
        run: |
          node qa\tests\sword-dao-production-contract-test.js
          node qa\tests\fist-dao-counter-runtime-test.js

      - name: Commit only after gates pass
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mind-m1-integrate.yml tools/mind-m1-integrate.mjs
          git add dist/core/battle-dao-v2-runtime.js dist/core/combat.js
          if git diff --cached --quiet; then
            echo "No integration changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(mind): wire M1 authority runtime"
          git push origin HEAD:main
