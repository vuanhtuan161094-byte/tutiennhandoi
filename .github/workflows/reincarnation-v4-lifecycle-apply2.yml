name: Reincarnation V4 Lifecycle Apply R2

on:
  push:
    branches:
      - feature/reincarnation-cultivation-r3

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reincarnation-cultivation-r3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and apply lifecycle patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/reincarnation-v4-lifecycle-patch.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(lines) if l.strip()=="python3 <<'PY'")+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          body=[]
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/reincarnation-v4-lifecycle-patch.py').write_text('\n'.join(body)+'\n')
          PY
          python3 /tmp/reincarnation-v4-lifecycle-patch.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('dist/core/session.js')
          s=p.read_text()
          pattern=r"(?P<indent>[ \t]*)const immortalPlayer = applyImmortalToEntity\(greatPlayer, this\.stateValue\.immortal, this\.stateValue\.realm, effectiveManifestationCapacity\(this\.stateValue\.immortal\.manifestationCapacity, this\.stateValue\.fateEmbryo\)\);\s*const fatePlayer = applyFateEmbryoToEntity\(immortalPlayer, this\.stateValue\.fateEmbryo, this\.fateEmbryoSummary\(\)\);\s*const talentedPlayer = applyReincarnationCombatTalents\(fatePlayer, this\.stateValue\.inheritedOrigins\);"
          def repl(m):
              i=m.group('indent')
              return f"{i}const immortalPlayer = applyImmortalToEntity(greatPlayer, this.stateValue.immortal, this.stateValue.realm, this.stateValue.immortal.manifestationCapacity);\n{i}const talentedPlayer = applyReincarnationCombatTalents(immortalPlayer, this.stateValue.inheritedOrigins);"
          s,_=re.subn(pattern,repl,s)
          p.write_text(s)
          PY
          echo '--- remaining Mệnh Thai runtime hooks ---'
          grep -n -C 3 'applyFateEmbryoToEntity\|effectiveManifestationCapacity' dist/core/session.js || true
      - name: Verify lifecycle closure
        run: |
          node --check dist/core/reincarnation-progression-v1102.js
          node --check dist/core/reincarnation-fate-build-v4.js
          node --check dist/core/reincarnation.js
          node --check dist/core/life.js
          node --check dist/core/session.js
          node qa/tests/reincarnation-v4-lifecycle-contract-test.js
          node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js
          node qa/tests/reincarnation-cultivation-r3-test.js
          node qa/tests/reincarnation-fate-build-v4-test.js
          node qa/tests/v140-cultivation-core-test.js
          node qa/tests/v140-cultivation-transport-test.js
          node qa/runners/v140-backend-gates.js fast
      - name: Commit runtime changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/core/reincarnation-progression-v1102.js dist/core/reincarnation.js dist/core/life.js dist/core/session.js qa/tests/reincarnation-v4-lifecycle-contract-test.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: rebuild reincarnation v4 lifecycle"
          git push origin HEAD:feature/reincarnation-cultivation-r3
