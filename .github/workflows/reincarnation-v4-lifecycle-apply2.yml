name: Reincarnation V4 Final Closure

on:
  push:
    branches:
      - feature/reincarnation-cultivation-r3

permissions:
  contents: write

jobs:
  closure:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reincarnation-cultivation-r3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fold Fate V4 and enforce read-model purity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fate_path=Path('dist/core/reincarnation-fate-build-v4.js')
          progress_path=Path('dist/core/reincarnation-progression-v1102.js')
          session_path=Path('dist/core/session.js')
          contract_path=Path('qa/tests/reincarnation-v4-lifecycle-contract-test.js')

          fate_src=fate_path.read_text()
          progress=progress_path.read_text()
          session=session_path.read_text()

          import_line="import { createFateBuildStateV4, cloneFateBuildStateV4 } from './reincarnation-fate-build-v4.js';\n"
          if import_line in progress:
              embedded=fate_src
              # Rename only JS identifiers/declarations. Never rewrite path ids or player-facing strings.
              embedded=embedded.replace('const fate = (pathId, pathName, tier, order, id, name, summary, modifiers, passive) => ({',
                                        'const fateV4Node = (pathId, pathName, tier, order, id, name, summary, modifiers, passive) => ({')
              embedded=embedded.replace("\n  fate(", "\n  fateV4Node(")
              embedded=embedded.replace('const cultivation = [', 'const fateV4Cultivation = [')
              embedded=embedded.replace('const combat = [', 'const fateV4Combat = [')
              embedded=embedded.replace('const body = [', 'const fateV4Body = [')
              embedded=embedded.replace('const wealth = [', 'const fateV4Wealth = [')
              embedded=embedded.replace('const idle = [', 'const fateV4Idle = [')
              embedded=embedded.replace('const raw = [...cultivation, ...combat, ...body, ...wealth, ...idle];',
                                        'const fateV4Raw = [...fateV4Cultivation, ...fateV4Combat, ...fateV4Body, ...fateV4Wealth, ...fateV4Idle];')
              embedded=embedded.replace('const ordered = raw.filter(', 'const ordered = fateV4Raw.filter(')
              embedded=embedded.replace('Object.freeze(raw.map(', 'Object.freeze(fateV4Raw.map(')
              embedded=embedded.replace('const starterIds = () =>', 'const fateV4StarterIds = () =>')
              embedded=embedded.replace('starterIds()', 'fateV4StarterIds()')

              progress=progress.replace(import_line,'')
              progress=embedded.rstrip()+"\n\n"+progress.lstrip()
              progress_path.write_text(progress)

              session=session.replace(
                  "from './reincarnation-fate-build-v4.js';",
                  "from './reincarnation-progression-v1102.js';"
              )

              fate_path.write_text("""// Compatibility barrel: Fate V4 implementation lives in reincarnation-progression-v1102.js\nexport {\n  FATE_V4_TIERS, FATE_V4_TIER_NAMES, FATE_V4_UNLOCK_COST_BY_TIER,\n  FATE_BUILD_DEFINITIONS_V4, FATE_BUILD_BY_ID_V4, FATE_BUILD_PATHS_V4, FATE_BUILD_TOTAL_UNLOCK_COST_V4,\n  createFateBuildStateV4, cloneFateBuildStateV4, fateBuildDefinitionV4, fateBuildUnlockPreviewV4,\n  unlockFateBuildV4, selectActiveFateBuildV4, activeFateBuildV4, activeFateBuildModifiersV4,\n} from './reincarnation-progression-v1102.js';\n""")

          # V4 read-model rule: checking Tọa Hóa eligibility must never write recharge timestamps/energy into save.
          a=session.index('    voluntaryPassingEligibility(')
          b=session.index('    enterMeditativePassing(', a)
          eligibility=session[a:b]
          eligibility=eligibility.replace(
              '        rp.energy=rechargeReincarnationEnergy(rp.energy,nowUnixMs);',
              '        const energyState=rechargeReincarnationEnergy(rp.energy,nowUnixMs);'
          )
          eligibility=eligibility.replace('rp.energy.current','energyState.current')
          if 'rp.energy=' in eligibility:
              raise SystemExit('voluntaryPassingEligibility still mutates RP energy')
          if 'const energyState=rechargeReincarnationEnergy' not in eligibility:
              raise SystemExit('read-only energy preview was not installed')
          session=session[:a]+eligibility+session[b:]
          session_path.write_text(session)

          # Lock the purity rule into the dedicated lifecycle contract.
          contract=contract_path.read_text()
          marker="assert(!session.includes('effectiveManifestationCapacity('));"
          purity="""const eligibilityBlock=session.slice(session.indexOf('    voluntaryPassingEligibility('),session.indexOf('    enterMeditativePassing('));\nassert(eligibilityBlock.includes('const energyState=rechargeReincarnationEnergy'));\nassert(!eligibilityBlock.includes('rp.energy='),'Tọa Hóa eligibility/read preview must not mutate Energy state.');"""
          if purity not in contract:
              contract=contract.replace(marker,marker+'\n'+purity)
          contract_path.write_text(contract)
          PY

      - name: Remove temporary V4 tooling from closure worktree
        run: |
          rm -f .github/workflows/reincarnation-v4-closure.yml
          rm -f .github/workflows/reincarnation-v4-finalize.yml
          rm -f .github/workflows/reincarnation-v4-lifecycle-apply2.yml
          rm -f .github/workflows/reincarnation-v4-lifecycle-patch.yml
          rm -f .github/workflows/reincarnation-v4-lifecycle-run.yml
          rm -f .github/workflows/reincarnation-v4-rebirth-diagnostic.yml
          rm -f qa/reincarnation-v4-finalize.py

      - name: Runtime syntax and dedicated contracts
        run: |
          node --check app.js
          node --check dist/core/reincarnation-progression-v1102.js
          node --check dist/core/reincarnation-fate-build-v4.js
          node --check dist/core/reincarnation.js
          node --check dist/core/life.js
          node --check dist/core/session.js
          node --check dist/core/gameplay-dispatch.js
          node qa/tests/reincarnation-v4-lifecycle-contract-test.js
          node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js
          node qa/tests/reincarnation-cultivation-r3-test.js
          node qa/tests/reincarnation-fate-build-v4-test.js
          node qa/tests/v140-cultivation-core-test.js
          node qa/tests/v140-cultivation-transport-test.js
          node qa/tests/v140-zero-legacy-test.js

      - name: Backend fast
        run: node qa/runners/v140-backend-gates.js fast

      - name: Frontend fast
        run: node qa/runners/v140-frontend-gates.js fast

      - name: Backend closure
        run: node qa/runners/v140-backend-gates.js closure

      - name: Frontend closure
        run: node qa/runners/v140-frontend-gates.js closure

      - name: Commit clean closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: close reincarnation v4 lifecycle workspace"
          git push origin HEAD:feature/reincarnation-cultivation-r3
