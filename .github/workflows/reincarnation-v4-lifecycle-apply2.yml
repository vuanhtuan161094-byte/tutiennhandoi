name: Reincarnation V4 Final Closure

on:
  push:
    branches:
      - feature/reincarnation-cultivation-r3

permissions:
  contents: write

jobs:
  closure:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reincarnation-cultivation-r3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove temporary V4 tooling from closure worktree
        run: |
          rm -f .github/workflows/reincarnation-v4-closure.yml
          rm -f .github/workflows/reincarnation-v4-finalize.yml
          rm -f .github/workflows/reincarnation-v4-lifecycle-apply2.yml
          rm -f .github/workflows/reincarnation-v4-lifecycle-patch.yml
          rm -f .github/workflows/reincarnation-v4-lifecycle-run.yml
          rm -f .github/workflows/reincarnation-v4-rebirth-diagnostic.yml
          rm -f qa/reincarnation-v4-finalize.py

      - name: Runtime syntax and dedicated contracts
        run: |
          node --check app.js
          node --check dist/core/reincarnation-progression-v1102.js
          node --check dist/core/reincarnation-fate-build-v4.js
          node --check dist/core/reincarnation.js
          node --check dist/core/life.js
          node --check dist/core/session.js
          node --check dist/core/gameplay-dispatch.js
          node qa/tests/reincarnation-v4-lifecycle-contract-test.js
          node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js
          node qa/tests/reincarnation-cultivation-r3-test.js
          node qa/tests/reincarnation-fate-build-v4-test.js
          node qa/tests/v140-cultivation-core-test.js
          node qa/tests/v140-cultivation-transport-test.js
          node qa/tests/v140-zero-legacy-test.js

      - name: Backend fast
        run: node qa/runners/v140-backend-gates.js fast

      - name: Frontend fast
        run: node qa/runners/v140-frontend-gates.js fast

      - name: Backend closure
        run: node qa/runners/v140-backend-gates.js closure

      - name: Frontend closure
        run: node qa/runners/v140-frontend-gates.js closure

      - name: Commit clean closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: close reincarnation v4 lifecycle workspace"
          git push origin HEAD:feature/reincarnation-cultivation-r3
