name: V144 Technique Legacy Audit

on:
  push:
    branches:
      - feature/v142-equipment-hunt

permissions:
  contents: read

jobs:
  audit:
    if: "startsWith(github.event.head_commit.message, 'chore(v144): audit technique runtime')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runtime dependency map
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TECHNIQUE RUNTIME IMPORTS/REFERENCES ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' -E "technique-runtime-v119|resolveTechniqueRuntimeV119|techniqueModifierTotalV119|techniqueCastTimeV119|techniqueRecoveryTimeV119|techniqueCooldownV119|techniqueSpiritCostV119" dist qa web src 2>/dev/null || true
          echo '=== ELEMENT SEAL IMPORTS/REFERENCES ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' -E "element-seal-v133|elementSealSummaryV133|setSkillElementSealV133|resolveAuthorizedSkillRootBindingsV133" dist qa web src 2>/dev/null || true
          echo '=== V125 LEGACY MANUAL FRAGMENT REFERENCES ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' -E "battleDaoTechniqueFragmentTargetsV125|addTechniqueFragmentsV125|restoreTechniqueManualV125|techniqueRestoreFragmentRequirementV125|restoredTechniqueIds|techniqueFragments" dist qa web src 2>/dev/null || true
          echo '=== LEGACY MANUAL PUBLIC API REFERENCES ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' -E "techniqueManualSummary|studyTechniqueManual|equipTechniqueManual|setTechniqueVariantsV119|setSkillElementSealV133|elementSealSummary" dist qa web src 2>/dev/null || true
          echo '=== CHARACTER TECHNIQUE APPLY/GROWTH REFERENCES ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' -E "gainTechniqueMastery|techniquePassiveStrengthMultiplier|techniqueMasteryGainMultiplier" dist qa web src 2>/dev/null || true
