name: V180 Lock High Specificity Tactical Floor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v180-lock-high-specificity-tactical-floor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch canonical high-specificity tactical floor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ui-combat-camera-polish.css')
          s=p.read_text(encoding='utf-8')
          marker='/* V180 high-specificity visible tactical text floor. */'
          block='''\n\n/* V180 high-specificity visible tactical text floor. */\n@media(max-width:430px){\n  body[data-game-screen="hunt"] .huntv2-screen .huntv2-stage .huntv2-skill-callout>small,\n  body[data-game-screen="hunt"] .huntv2-screen .huntv2-stage .huntv2-skill-callout>em,\n  body[data-game-screen="hunt"] .huntv2-screen .huntv2-stage .huntv2-enemy-intent>small,\n  body[data-game-screen="hunt"] .huntv2-screen .huntv2-stage .huntv2-enemy-intent>span,\n  body[data-game-screen="hunt"] .huntv2-screen .huntv2-stage .huntv2-enemy-intent>b,\n  body[data-game-screen="hunt"] .huntv2-screen .huntv2-stage .huntv2-stage-boss-telegraph small,\n  body[data-game-screen="hunt"] .huntv2-screen .huntv2-stage .huntv2-break-window small,\n  body[data-game-screen="hunt"] .huntv2-screen .huntv2-stage .huntv2-combat-caption strong,\n  body[data-game-screen="hunt"] .huntv2-screen .huntv2-stage .huntv2-combat-caption span{\n    font-size:10px!important;\n    line-height:1!important\n  }\n}\n'''
          if marker not in s:
              s=s.rstrip()+block
              p.write_text(s,encoding='utf-8')

          html=Path('index.html')
          h=html.read_text(encoding='utf-8').replace('combat-camera-polish-v13-20260916','combat-camera-polish-v14-20260916')
          html.write_text(h,encoding='utf-8')

          test=Path('qa/tests/ui-combat-readability-target-test.js')
          t=test.read_text(encoding='utf-8').replace('combat-camera-polish-v13-20260916','combat-camera-polish-v14-20260916')
          if 'High-specificity tactical labels must preserve the 10px portrait floor' not in t:
              t += "\nassert.match(camera,/V180 high-specificity visible tactical text floor[\\s\\S]*?\\.huntv2-screen \\.huntv2-stage \\.huntv2-skill-callout>small[\\s\\S]*?font-size:10px!important/,'High-specificity tactical labels must preserve the 10px portrait floor');\n"
              test.write_text(t,encoding='utf-8')
          PY
          node qa/tests/ui-combat-readability-target-test.js
      - name: Self-clean and commit
        shell: bash
        run: |
          git rm .github/workflows/v180-lock-high-specificity-tactical-floor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-combat-camera-polish.css index.html qa/tests/ui-combat-readability-target-test.js
          git commit -m 'fix(ui): lock portrait tactical labels at 10px'
          git push origin HEAD:main
