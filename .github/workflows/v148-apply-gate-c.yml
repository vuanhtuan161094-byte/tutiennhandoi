name: V148 Apply Gate C
on:
  push:
    branches: [feature/v148-confidant-rebuild]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply guarded V148 Gate C patch
        run: node qa/tools/v148-apply-gate-c.js
      - name: Syntax check closure runtime
        run: |
          node --check dist/core/confidant-v87.js
          node --check dist/core/collection-progression-v12316.js
          node --check dist/core/gacha-collection-economy-v12325.js
          node --check dist/core/collection-workshop-gacha-v12326.js
          node --check app.js
          node --check qa/tests/v148-confidant-rebuild-test.js
      - name: Dedicated V148 closure
        run: node qa/tests/v148-confidant-rebuild-test.js
      - name: Canonical backend fast
        run: node qa/runners/v140-backend-gates.js fast
      - name: Canonical frontend fast
        run: node qa/runners/v140-frontend-gates.js fast
      - name: Commit tested Gate C output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/core/confidant-v87.js dist/core/collection-progression-v12316.js dist/core/gacha-collection-economy-v12325.js dist/core/collection-workshop-gacha-v12326.js app.js qa/tests/v148-confidant-rebuild-test.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(v148): preserve legacy unlocks and close progression gaps"
          git push origin HEAD:feature/v148-confidant-rebuild
