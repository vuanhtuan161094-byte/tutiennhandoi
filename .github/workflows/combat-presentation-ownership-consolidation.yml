name: Combat Presentation Ownership Consolidation

on:
  push:
    branches: [main]
    paths:
      - 'qa/tools/consolidate-combat-presentation-ownership-v2.mjs'
      - '.github/workflows/combat-presentation-ownership-consolidation.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current main is unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved; aborting safe consolidation'; exit 2; }
      - name: Apply geometry ownership consolidation
        run: node qa/tools/consolidate-combat-presentation-ownership-v2.mjs
      - name: Targeted verification
        run: |
          node --check modules/hunt-combat-v2.js
          node qa/tests/ui-combat-hp-display-contract-test.js
          node qa/tests/ui-combat-presentation-ownership-test.js
          node qa/tests/ui-combat-readability-target-test.js
          node qa/tests/ui-combat-status-authority-test.js
          node qa/tests/ui-combat-showcase-contract-test.js
          node qa/runners/v140-frontend-gates.js fast
      - name: Commit production consolidation and remove one-shot plumbing
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved during verification; aborting push'; exit 2; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f qa/tools/consolidate-combat-presentation-ownership-v1.mjs qa/tools/consolidate-combat-presentation-ownership-v2.mjs .github/workflows/combat-presentation-ownership-consolidation.yml
          git add -A
          git commit -m "refactor(combat): consolidate portrait geometry ownership"
          git push origin HEAD:main
