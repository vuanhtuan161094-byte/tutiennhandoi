name: V148 Yến Vũ Burst Correction
on:
  push:
    branches:
      - feature/v148-confidant-rebuild
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct immortal burst hierarchy
        shell: python
        run: |
          from pathlib import Path
          p=Path('dist/core/confidant-v87.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            "effects: [damage(.42, 18, 'Metal')]":"effects: [damage(.52, 18, 'Metal')]",
            "effects: [shield(.09, 2), damage(.38, 14, 'Metal')]":"effects: [shield(.09, 2), damage(.45, 14, 'Metal')]",
            "effects: [status('status.rhino_armor_broken', 4), damage(.82, 34, 'Metal')]":"effects: [status('status.rhino_armor_broken', 4), damage(1.05, 34, 'Metal')]",
            "'companion.7': [{event:'OnHit',sourceTags:['ActiveHit'],gain:4},{event:'OnCrit',sourceTags:['ActiveHit'],gain:14},{event:'OnShieldBreak',gain:24}]":"'companion.7': [{event:'OnHit',sourceTags:['ActiveHit'],gain:5},{event:'OnCrit',sourceTags:['ActiveHit'],gain:16},{event:'OnShieldBreak',gain:24}]",
          }
          for old,new in replacements.items():
            if s.count(old)!=1: raise SystemExit(f'Expected exactly one match, found {s.count(old)}: {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/core/confidant-v87.js
          git commit -m "balance(v148): restore Yen Vu immortal burst hierarchy"
          git push origin HEAD:feature/v148-confidant-rebuild
