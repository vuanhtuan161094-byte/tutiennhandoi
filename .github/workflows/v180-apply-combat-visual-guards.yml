name: V180 Apply Combat Visual Proof Guards

on:
  push:
    branches:
      - main
    paths:
      - 'qa/tools/apply-v180-combat-visual-proof-guards.mjs'
      - '.github/workflows/v180-apply-combat-visual-guards.yml'

permissions:
  contents: write

concurrency:
  group: v180-combat-visual-proof-guards
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply V180 combat visual proof guards') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply visual proof guards
        run: node qa/tools/apply-v180-combat-visual-proof-guards.mjs

      - name: Verify capture runner syntax
        run: node --check qa/visual/capture-combat-runtime.mjs

      - name: Commit visual proof guards
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- qa/visual/capture-combat-runtime.mjs; then
            echo 'No change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/visual/capture-combat-runtime.mjs
          git commit -m 'test(ui): apply V180 combat visual proof guards'
          git push origin HEAD:main
