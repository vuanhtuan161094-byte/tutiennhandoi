name: QA

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Active phase gates
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"; shift
            local log
            log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              echo "PASS · $label"
            else
              echo "FAIL · $label"
              cat "$log"
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          }
          run_quiet "V161 B1 retreat" node qa/tests/v161-retreat-contract-audit-test.js
          run_quiet "V161 B2 early pacing" node qa/tests/v161-early-pacing-test.js
          run_quiet "V161 B3 Bound Jade" node qa/tests/v161-bound-jade-spend-model-test.js
          run_quiet "V161 B4 manual pacing" node qa/tests/v161-manual-acquisition-pacing-test.js
          run_quiet "V161 B5 Spiritual Root × Hunt" node qa/tests/v161-spiritual-root-hunt-pacing-test.js
          run_quiet "V161 B6 economy source/sink" node qa/tests/v161-economy-source-sink-test.js
          run_quiet "V162 Collection authority B1-B5" node qa/tests/v162-collection-runtime-authority-test.js
          run_quiet "V163 B1 Artifact/Relic authority" node qa/tests/v163-artifact-runtime-authority-test.js
          run_quiet "V163 B2 Artifact/Relic mutation authority" node qa/tests/v163-artifact-mutation-authority-test.js
          run_quiet "V163 B3 Artifact/Relic read-combat authority" node qa/tests/v163-artifact-read-combat-authority-test.js
          run_quiet "V163 B4 Artifact/Relic compatibility cleanup" node qa/tests/v163-artifact-compatibility-cleanup-test.js
          run_quiet "V164 B1 Pet/Confidant runtime authority" node qa/tests/v164-pet-confidant-runtime-authority-test.js
          run_quiet "V164 B2/B3 Pet/Confidant transport-combat" node qa/tests/v164-pet-confidant-integration-authority-test.js
          run_quiet "V165 B1 Equipment runtime authority" node qa/tests/v165-equipment-runtime-authority-test.js
          run_quiet "V166 Manual/Skill/Heart authority" node qa/tests/v166-manual-skill-heart-runtime-authority-test.js
          run_quiet "V167 Alchemy authority" node qa/tests/v167-alchemy-runtime-authority-test.js

      - name: Backend fast gate
        run: node qa/runners/v140-backend-gates.js fast

      - name: Frontend fast gate
        run: node qa/runners/v140-frontend-gates.js fast

  canonical-qa:
    needs: fast-qa
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[closure]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locked baseline V140-V151
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() { local label="$1"; shift; local log; log="$(mktemp)"; if "$@" >"$log" 2>&1; then echo "PASS · $label"; else echo "FAIL · $label"; cat "$log"; rm -f "$log"; exit 1; fi; rm -f "$log"; }
          run_quiet "V140 cultivation core" node qa/tests/v140-cultivation-core-test.js
          run_quiet "V140 cultivation transport" node qa/tests/v140-cultivation-transport-test.js
          run_quiet "V140 zero legacy" node qa/tests/v140-zero-legacy-test.js
          run_quiet "V141 Hunt × Cultivation" node qa/tests/v141-hunt-cultivation-closure-test.js
          run_quiet "V142 Equipment × Hunt" node qa/runners/v142-equipment-hunt-gate.js
          run_quiet "V145 Spiritual Root core" node qa/tests/v145-spiritual-root-redesign-test.js
          run_quiet "V145 Spiritual Root runtime" node qa/tests/v145-spiritual-root-runtime-test.js
          run_quiet "V145 Spiritual Root realm origin" node qa/tests/v145-spiritual-root-realm-origin-test.js
          run_quiet "V145 Spiritual Root UI" node qa/tests/v145-spiritual-root-ui-test.js
          run_quiet "V146 Alchemy core" node qa/tests/v146-alchemy-core-test.js
          run_quiet "V146 Alchemy runtime" node qa/tests/v146-alchemy-source-runtime-test.js
          run_quiet "V146 Alchemy closure" node qa/tests/v146-alchemy-closure-test.js
          run_quiet "V148 Confidant balance" node qa/tests/v148-confidant-v129-balance-test.js
          run_quiet "V149 Artifact core" node qa/tests/v149-artifact-core-test.js
          run_quiet "V149 Artifact production" node qa/tests/v149-artifact-production-test.js
          run_quiet "V149 Artifact combo" node qa/tests/v149-artifact-combo-test.js
          run_quiet "V149 Artifact balance" node qa/tests/v149-artifact-v129-balance-test.js
          run_quiet "V150 Artifact no-resource" node qa/tests/v150-artifact-no-baoqi-test.js
          run_quiet "V151 Relic production" node qa/tests/v151-relic-production-test.js
          run_quiet "V151 Relic balance" node qa/tests/v151-relic-v129-balance-test.js

      - name: Locked authorities V152-V159
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() { local label="$1"; shift; local log; log="$(mktemp)"; if "$@" >"$log" 2>&1; then echo "PASS · $label"; else echo "FAIL · $label"; cat "$log"; rm -f "$log"; exit 1; fi; rm -f "$log"; }
          run_quiet "V152 manual progression" node qa/tests/v127-manual-progression-test.js
          run_quiet "V152 manual combat consumer" node qa/tests/v127-manual-combat-consumer-test.js
          run_quiet "V153 reincarnation" node qa/tests/reincarnation-cultivation-r3-test.js
          run_quiet "V153 reincarnation invariant" node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js
          run_quiet "V154 clone authority" node qa/tests/v127-clone-authority-migration-test.js
          run_quiet "V155 skills and heart authority" node qa/tests/v129-major-systems-audit-test.js
          run_quiet "V156 DongFu production" node qa/tests/v99-dongfu-production-test.js
          run_quiet "V156 DongFu transport" node qa/tests/v99-dongfu-transport-test.js
          run_quiet "V157 endgame continuity" node qa/tests/v129-endgame-continuity-structural-test.js
          run_quiet "V158 player journey" node qa/tests/v158-player-journey-integration-test.js
          run_quiet "V159 economy pacing" node qa/tests/v159-economy-pacing-variety-test.js

      - name: V160 locked audit evidence
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() { local label="$1"; shift; local log; log="$(mktemp)"; if "$@" >"$log" 2>&1; then echo "PASS · $label"; else echo "FAIL · $label"; cat "$log"; rm -f "$log"; exit 1; fi; rm -f "$log"; }
          run_quiet "V160 full-life pacing" node qa/tests/v160-full-life-economy-pacing-test.js
          run_quiet "V160 acquisition economy" node qa/tests/v160-acquisition-economy-test.js
          run_quiet "V160 reconciled closure" node qa/tests/v160-full-life-audit-closure-test.js

      - name: V161 locked closure gates
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() { local label="$1"; shift; local log; log="$(mktemp)"; if "$@" >"$log" 2>&1; then echo "PASS · $label"; else echo "FAIL · $label"; cat "$log"; rm -f "$log"; exit 1; fi; rm -f "$log"; }
          run_quiet "V161 B1 retreat" node qa/tests/v161-retreat-contract-audit-test.js
          run_quiet "V161 B2 early pacing" node qa/tests/v161-early-pacing-test.js
          run_quiet "V161 B3 Bound Jade" node qa/tests/v161-bound-jade-spend-model-test.js
          run_quiet "V161 B4 manual pacing" node qa/tests/v161-manual-acquisition-pacing-test.js
          run_quiet "V161 B5 Spiritual Root × Hunt" node qa/tests/v161-spiritual-root-hunt-pacing-test.js
          run_quiet "V161 B6 economy source/sink" node qa/tests/v161-economy-source-sink-test.js

      - name: V162 Collection authority closure
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() { local label="$1"; shift; local log; log="$(mktemp)"; if "$@" >"$log" 2>&1; then echo "PASS · $label"; else echo "FAIL · $label"; cat "$log"; rm -f "$log"; exit 1; fi; rm -f "$log"; }
          run_quiet "V162 Collection authority B1-B5" node qa/tests/v162-collection-runtime-authority-test.js

      - name: V163 Artifact / Relic authority closure
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() { local label="$1"; shift; local log; log="$(mktemp)"; if "$@" >"$log" 2>&1; then echo "PASS · $label"; else echo "FAIL · $label"; cat "$log"; rm -f "$log"; exit 1; fi; rm -f "$log"; }
          run_quiet "V163 B1 authority" node qa/tests/v163-artifact-runtime-authority-test.js
          run_quiet "V163 B2 mutation" node qa/tests/v163-artifact-mutation-authority-test.js
          run_quiet "V163 B3 read/combat" node qa/tests/v163-artifact-read-combat-authority-test.js
          run_quiet "V163 B4 compatibility" node qa/tests/v163-artifact-compatibility-cleanup-test.js

      - name: V164 Pet / Confidant authority closure
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() { local label="$1"; shift; local log; log="$(mktemp)"; if "$@" >"$log" 2>&1; then echo "PASS · $label"; else echo "FAIL · $label"; cat "$log"; rm -f "$log"; exit 1; fi; rm -f "$log"; }
          run_quiet "V164 B1 runtime authority" node qa/tests/v164-pet-confidant-runtime-authority-test.js
          run_quiet "V164 B2/B3 transport combat" node qa/tests/v164-pet-confidant-integration-authority-test.js

      - name: V165 Equipment authority closure
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() { local label="$1"; shift; local log; log="$(mktemp)"; if "$@" >"$log" 2>&1; then echo "PASS · $label"; else echo "FAIL · $label"; cat "$log"; rm -f "$log"; exit 1; fi; rm -f "$log"; }
          run_quiet "V165 B1 runtime authority" node qa/tests/v165-equipment-runtime-authority-test.js

      - name: V166 Manual / Skill / Heart authority closure
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() { local label="$1"; shift; local log; log="$(mktemp)"; if "$@" >"$log" 2>&1; then echo "PASS · $label"; else echo "FAIL · $label"; cat "$log"; rm -f "$log"; exit 1; fi; rm -f "$log"; }
          run_quiet "V166 runtime authority" node qa/tests/v166-manual-skill-heart-runtime-authority-test.js

      - name: V167 Alchemy authority closure
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() { local label="$1"; shift; local log; log="$(mktemp)"; if "$@" >"$log" 2>&1; then echo "PASS · $label"; else echo "FAIL · $label"; cat "$log"; rm -f "$log"; exit 1; fi; rm -f "$log"; }
          run_quiet "V167 runtime authority" node qa/tests/v167-alchemy-runtime-authority-test.js

      - name: Backend closure
        run: node qa/runners/v140-backend-gates.js closure

      - name: Frontend closure
        run: node qa/runners/v140-frontend-gates.js closure
