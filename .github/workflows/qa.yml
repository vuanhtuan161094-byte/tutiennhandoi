name: QA

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: cmd

jobs:
  fast-qa:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Active phase gates
        run: |
          @echo off
          node qa/tests/v161-retreat-contract-audit-test.js || exit /b 1
          node qa/tests/v161-early-pacing-test.js || exit /b 1
          node qa/tests/v161-bound-jade-spend-model-test.js || exit /b 1
          node qa/tests/v161-manual-acquisition-pacing-test.js || exit /b 1
          node qa/tests/v161-spiritual-root-hunt-pacing-test.js || exit /b 1
          node qa/tests/v161-economy-source-sink-test.js || exit /b 1
          node qa/tests/v162-collection-runtime-authority-test.js || exit /b 1
          node qa/tests/v163-artifact-runtime-authority-test.js || exit /b 1
          node qa/tests/v163-artifact-mutation-authority-test.js || exit /b 1
          node qa/tests/v163-artifact-read-combat-authority-test.js || exit /b 1
          node qa/tests/v163-artifact-compatibility-cleanup-test.js || exit /b 1
          node qa/tests/v164-pet-confidant-runtime-authority-test.js || exit /b 1
          node qa/tests/v164-pet-confidant-integration-authority-test.js || exit /b 1
          node qa/tests/v165-equipment-runtime-authority-test.js || exit /b 1
          node qa/tests/v166-manual-skill-heart-runtime-authority-test.js || exit /b 1
          node qa/tests/v167-alchemy-runtime-authority-test.js || exit /b 1
          node qa/tests/v168-combat-stat-runtime-authority-test.js || exit /b 1
          node qa/tests/v169-idle-runtime-authority-test.js || exit /b 1

      - name: Backend fast gate
        run: node qa/runners/v140-backend-gates.js fast

      - name: Frontend fast gate
        run: node qa/runners/v140-frontend-gates.js fast

  canonical-qa:
    needs: fast-qa
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[closure]') }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locked baseline V140-V151
        run: |
          @echo off
          node qa/tests/v140-cultivation-core-test.js || exit /b 1
          node qa/tests/v140-cultivation-transport-test.js || exit /b 1
          node qa/tests/v140-zero-legacy-test.js || exit /b 1
          node qa/tests/v141-hunt-cultivation-closure-test.js || exit /b 1
          node qa/runners/v142-equipment-hunt-gate.js || exit /b 1
          node qa/tests/v145-spiritual-root-redesign-test.js || exit /b 1
          node qa/tests/v145-spiritual-root-runtime-test.js || exit /b 1
          node qa/tests/v145-spiritual-root-realm-origin-test.js || exit /b 1
          node qa/tests/v145-spiritual-root-ui-test.js || exit /b 1
          node qa/tests/v146-alchemy-core-test.js || exit /b 1
          node qa/tests/v146-alchemy-source-runtime-test.js || exit /b 1
          node qa/tests/v146-alchemy-closure-test.js || exit /b 1
          node qa/tests/v148-confidant-v129-balance-test.js || exit /b 1
          node qa/tests/v149-artifact-core-test.js || exit /b 1
          node qa/tests/v149-artifact-production-test.js || exit /b 1
          node qa/tests/v149-artifact-combo-test.js || exit /b 1
          node qa/tests/v149-artifact-v129-balance-test.js || exit /b 1
          node qa/tests/v150-artifact-no-baoqi-test.js || exit /b 1
          node qa/tests/v151-relic-production-test.js || exit /b 1
          node qa/tests/v151-relic-v129-balance-test.js || exit /b 1

      - name: Locked authorities V152-V159
        run: |
          @echo off
          node qa/tests/v127-manual-progression-test.js || exit /b 1
          node qa/tests/v127-manual-combat-consumer-test.js || exit /b 1
          node qa/tests/reincarnation-cultivation-r3-test.js || exit /b 1
          node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js || exit /b 1
          node qa/tests/v127-clone-authority-migration-test.js || exit /b 1
          node qa/tests/v129-major-systems-audit-test.js || exit /b 1
          node qa/tests/v99-dongfu-production-test.js || exit /b 1
          node qa/tests/v99-dongfu-transport-test.js || exit /b 1
          node qa/tests/v129-endgame-continuity-structural-test.js || exit /b 1
          node qa/tests/v158-player-journey-integration-test.js || exit /b 1
          node qa/tests/v159-economy-pacing-variety-test.js || exit /b 1

      - name: V160 locked audit evidence
        run: |
          @echo off
          node qa/tests/v160-full-life-economy-pacing-test.js || exit /b 1
          node qa/tests/v160-acquisition-economy-test.js || exit /b 1
          node qa/tests/v160-full-life-audit-closure-test.js || exit /b 1

      - name: V161 locked closure gates
        run: |
          @echo off
          node qa/tests/v161-retreat-contract-audit-test.js || exit /b 1
          node qa/tests/v161-early-pacing-test.js || exit /b 1
          node qa/tests/v161-bound-jade-spend-model-test.js || exit /b 1
          node qa/tests/v161-manual-acquisition-pacing-test.js || exit /b 1
          node qa/tests/v161-spiritual-root-hunt-pacing-test.js || exit /b 1
          node qa/tests/v161-economy-source-sink-test.js || exit /b 1

      - name: V162 Collection authority closure
        run: node qa/tests/v162-collection-runtime-authority-test.js

      - name: V163 Artifact / Relic authority closure
        run: |
          @echo off
          node qa/tests/v163-artifact-runtime-authority-test.js || exit /b 1
          node qa/tests/v163-artifact-mutation-authority-test.js || exit /b 1
          node qa/tests/v163-artifact-read-combat-authority-test.js || exit /b 1
          node qa/tests/v163-artifact-compatibility-cleanup-test.js || exit /b 1

      - name: V164 Pet / Confidant authority closure
        run: |
          @echo off
          node qa/tests/v164-pet-confidant-runtime-authority-test.js || exit /b 1
          node qa/tests/v164-pet-confidant-integration-authority-test.js || exit /b 1

      - name: V165 Equipment authority closure
        run: node qa/tests/v165-equipment-runtime-authority-test.js

      - name: V166 Manual / Skill / Heart authority closure
        run: node qa/tests/v166-manual-skill-heart-runtime-authority-test.js

      - name: V167 Alchemy authority closure
        run: node qa/tests/v167-alchemy-runtime-authority-test.js

      - name: V168 Combat / Stat authority closure
        run: node qa/tests/v168-combat-stat-runtime-authority-test.js

      - name: V169 Idle authority closure
        run: node qa/tests/v169-idle-runtime-authority-test.js

      - name: Backend closure
        run: node qa/runners/v140-backend-gates.js closure

      - name: Frontend closure
        run: node qa/runners/v140-frontend-gates.js closure
