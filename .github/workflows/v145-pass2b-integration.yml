name: V145 Pass2B Realm Origin

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v142-equipment-hunt
    paths:
      - 'qa/tools/v145-pass2-realm-origin.mjs'
      - 'qa/tools/v145-pass2-realm-testfix.mjs'
      - 'qa/tools/v145-pass2-regression-fix.mjs'
      - '.github/workflows/v145-pass2b-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v142-equipment-hunt
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V145 pass2 source sink API
        run: node qa/tools/v145-pass2-integration.mjs
      - name: Write V145 pass2 runtime test
        run: node qa/tools/v145-pass2-testwriter.mjs
      - name: Align session-load migration
        run: node qa/tools/v145-pass2-fix.mjs
      - name: Apply realm-gated Bản Nguyên and 3-to-1 combine
        run: node qa/tools/v145-pass2-realm-origin.mjs
      - name: Stage realm-origin tests
        run: node qa/tools/v145-pass2-realm-testfix.mjs
      - name: Align V143 regression authority
        run: node qa/tools/v145-pass2-regression-fix.mjs
      - name: V145 core
        run: node qa/tests/v145-spiritual-root-redesign-test.js
      - name: V145 source sink runtime
        run: node qa/tests/v145-spiritual-root-runtime-test.js
      - name: V145 realm origin
        run: node qa/tests/v145-spiritual-root-realm-origin-test.js
      - name: V140 cultivation core
        run: node qa/tests/v140-cultivation-core-test.js
      - name: V141 Hunt x Cultivation
        run: node qa/tests/v141-hunt-cultivation-closure-test.js
      - name: V142 Equipment x Hunt
        run: node qa/runners/v142-equipment-hunt-gate.js
      - name: V144 retirement
        run: node qa/tests/v144-technique-v103-retirement-test.js
      - name: Backend fast gate
        run: node qa/runners/v140-backend-gates.js fast
      - name: Remove temporary V145 machinery
        run: |
          rm qa/tools/v145-pass2-integration.mjs
          rm qa/tools/v145-pass2-testwriter.mjs
          rm qa/tools/v145-pass2-fix.mjs
          rm qa/tools/v145-pass2-realm-origin.mjs
          rm qa/tools/v145-pass2-realm-testfix.mjs
          rm qa/tools/v145-pass2-regression-fix.mjs
          rm .github/workflows/v145-pass2-integration.yml
          rm .github/workflows/v145-pass2b-integration.yml
      - name: Commit V145 pass2 source
        run: |
          git config user.name 'vuanhtuan161094-byte'
          git config user.email 'vuanhtuan161094@gmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v145): wire realm-gated spiritual root origins'
          git push origin HEAD:feature/v142-equipment-hunt
