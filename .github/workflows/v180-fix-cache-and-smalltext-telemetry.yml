name: V180 Fix Cache And SmallText Telemetry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v180-fix-cache-and-smalltext-telemetry.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch QA contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('qa/tests/ui-combat-readability-target-test.js')
          s=p.read_text(encoding='utf-8')
          old='combat-camera-polish-v10-20260916'
          new='combat-camera-polish-v11-20260916'
          if old in s:
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          p=Path('qa/visual/capture-combat-runtime.mjs')
          s=p.read_text(encoding='utf-8')
          old=".map(e=>({text:String(e.textContent||'').trim().slice(0,48),font:parseFloat(getComputedStyle(e).fontSize)||0,cls:String(e.className||'').slice(0,120)})).filter(x=>x.font>0&&x.font<10).slice(0,80)"
          new=".map(e=>({text:String(e.textContent||'').trim().slice(0,48),font:parseFloat(getComputedStyle(e).fontSize)||0,tag:e.tagName?.toLowerCase?.()||'',cls:String(e.className||'').slice(0,120),parentTag:e.parentElement?.tagName?.toLowerCase?.()||'',parentCls:String(e.parentElement?.className||'').slice(0,160),html:String(e.outerHTML||'').replace(/\\s+/g,' ').slice(0,260)})).filter(x=>x.font>0&&x.font<10).slice(0,80)"
          if old not in s:
              raise SystemExit('smallText telemetry target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check qa/visual/capture-combat-runtime.mjs
          node qa/tests/ui-combat-readability-target-test.js
      - name: Self-clean and commit
        shell: bash
        run: |
          git rm .github/workflows/v180-fix-cache-and-smalltext-telemetry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/tests/ui-combat-readability-target-test.js qa/visual/capture-combat-runtime.mjs
          git commit -m 'test(ui): sync combat cache contract and small-text telemetry'
          git push origin HEAD:main
