name: V180 Fix DoT Damage Label Floor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v180-fix-dot-damage-label-floor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch canonical DoT damage label floor and cache contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css=Path('ui-combat-camera-polish.css')
          s=css.read_text(encoding='utf-8')
          marker='/* V180 exact visible DoT damage-label floor. */'
          block='''\n\n/* V180 exact visible DoT damage-label floor. */\n@media(max-width:430px){\n  body[data-game-screen="hunt"] .huntv2-screen .huntv2-float.damage-main>span{\n    font-size:10px!important;\n    line-height:1!important\n  }\n}\n'''
          if marker not in s:
              s=s.rstrip()+block
              css.write_text(s,encoding='utf-8')

          html=Path('index.html')
          h=html.read_text(encoding='utf-8')
          h=h.replace('combat-camera-polish-v11-20260916','combat-camera-polish-v12-20260916')
          html.write_text(h,encoding='utf-8')

          test=Path('qa/tests/ui-combat-readability-target-test.js')
          t=test.read_text(encoding='utf-8')
          t=t.replace('combat-camera-polish-v11-20260916','combat-camera-polish-v12-20260916')
          anchor="assert.match(camera,/V180 portrait tactical text floor[\\s\\S]*?\\.huntv2-enemy-intent span,[\\s\\S]*?\\.huntv2-result-pop span,[\\s\\S]*?font-size:10px!important/,'Transient combat text must have an explicit 10px portrait floor');"
          extra="\nassert.match(camera,/V180 exact visible DoT damage-label floor[\\s\\S]*?\\.huntv2-float\\.damage-main>span\\{[\\s\\S]*?font-size:10px!important/,'Visible DoT damage labels must never render below 10px on portrait');"
          if 'Visible DoT damage labels must never render below 10px on portrait' not in t:
              if anchor not in t:
                  raise SystemExit('test anchor not found')
              t=t.replace(anchor,anchor+extra,1)
              test.write_text(t,encoding='utf-8')
          PY
          node qa/tests/ui-combat-readability-target-test.js
      - name: Self-clean and commit
        shell: bash
        run: |
          git rm .github/workflows/v180-fix-dot-damage-label-floor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-combat-camera-polish.css index.html qa/tests/ui-combat-readability-target-test.js
          git commit -m 'fix(ui): lock portrait DoT damage label at 10px'
          git push origin HEAD:main
