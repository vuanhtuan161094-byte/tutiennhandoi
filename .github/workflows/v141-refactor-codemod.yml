name: V141 Refactor Codemod

on:
  push:
    branches:
      - 'refactor/v141-codebase-optimization'

permissions:
  contents: write

jobs:
  prune-session-migrations:
    if: github.event.head_commit.message == 'chore: run V141 session migration prune'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic codemod
        run: node qa/tools/v141-prune-session-migrations.js

      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo "No codemod changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/core/session.js
          git commit -m "refactor: prune obsolete pre-V140 save migrations [v141-codemod]"
          git push origin HEAD:refactor/v141-codebase-optimization
