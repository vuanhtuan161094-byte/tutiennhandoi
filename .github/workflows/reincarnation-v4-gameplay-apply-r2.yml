name: Reincarnation V4 Gameplay Apply R2
on:
  push:
    branches: [feature/reincarnation-cultivation-r3]
    paths: ['.github/workflows/reincarnation-v4-gameplay-apply-r2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reincarnation-cultivation-r3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden staged patch R7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/reincarnation-v4-gameplay-patch.py'); s=p.read_text()
          s=s.replace('s=s.replace("+ 6;","+ this.fateSpiritStoneGainV4(6);",1)\ns=s.replace("+ 10;","+ this.fateSpiritStoneGainV4(10);",1)\ns=s.replace("+ 8;","+ this.fateSpiritStoneGainV4(8);",1)', '''s=rep(s,"this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + 6;","this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + this.fateSpiritStoneGainV4(6);",'tutorial stones 6')
          s=rep(s,"this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + 10;","this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + this.fateSpiritStoneGainV4(10);",'tutorial stones 10')
          s=rep(s,"this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + 8;","this.stateValue.inventory['resource.spirit_stone'] = (this.stateValue.inventory['resource.spirit_stone'] ?? 0) + this.fateSpiritStoneGainV4(8);",'tutorial stones 8')''')
          old="return { ...stats, attack: Math.max(0, Number(stats.attack) || 0) * (1 + damagePct / 100), defense: Math.max(0, Number(stats.defense) || 0) * (1 + defensePct / 100), physique, maxHp, damageReductionPct: combineStatPctV129('damageReductionPct', stats.damageReductionPct ?? 0, damageReductionPct) };"
          new="return { ...stats, attack: Math.max(0, Number(stats.attack) || 0), defense: Math.max(0, Number(stats.defense) || 0) * (1 + defensePct / 100), physique, maxHp, damageReductionPct: combineStatPctV129('damageReductionPct', stats.damageReductionPct ?? 0, damageReductionPct) };"
          if old not in s: raise SystemExit('missing Fate stat semantic anchor')
          s=s.replace(old,new,1)
          old="function fateBossDamageMultiplierV4(source,target){ const pct=Math.max(0,Number(source?.combatBuildV117?.fateV4?.bossDamagePct)||0); const boss=target?.tags?.some(tag=>['boss','dungeonguardian','bosslike'].includes(String(tag).toLowerCase())); return boss?1+pct/100:1; }"
          new="function fateOutgoingDamageMultiplierV4(source,target){ const fate=source?.combatBuildV117?.fateV4??{},general=Math.max(0,Number(fate.damagePct)||0),bossPct=Math.max(0,Number(fate.bossDamagePct)||0),boss=target?.tags?.some(tag=>['boss','dungeonguardian','bosslike'].includes(String(tag).toLowerCase())); return (1+general/100)*(boss?1+bossPct/100:1); }"
          if old not in s: raise SystemExit('missing Fate damage helper anchor')
          s=s.replace(old,new,1).replace('fateBossDamageMultiplierV4(source,target)','fateOutgoingDamageMultiplierV4(source,target)')
          combat_anchor="# 5) Session: sync chosen Fate to character runtime, Bế Quan/offline/Tài Mệnh, and new RP inputs."
          combat_insert="""\n# 4b) Production mortal currently uses legacy CombatEngine path; Fate damage must apply there too.\np='dist/core/combat.js'; s=read(p)\ns=rep(s,\n\"        let damage = raw * defenseFactor(srcStats.attack, dstStats.defense, 0);\",\n\"        let damage = raw * fateOutgoingDamageMultiplierV4(source,target) * defenseFactor(srcStats.attack, dstStats.defense, 0);\",'legacy fate outgoing damage')\nwrite(p,s)\n\n"""
          if combat_anchor not in s: raise SystemExit('missing combat legacy insertion anchor')
          s=s.replace(combat_anchor,combat_insert+combat_anchor,1)
          s=s.replace("assert(b.stats.attack>a.stats.attack*1.19); assert(combatMaxHp(b.stats)>combatMaxHp(a.stats)*1.27);", "assert.equal(b.combatBuildV117.fateV4.damagePct,20); assert(combatMaxHp(b.stats)>combatMaxHp(a.stats)*1.27);")
          marker="test('Boss Damage của Chiến Mệnh is consumed inside CombatKernel V2',()=>{"
          generic="""test('Damage của Chiến Mệnh is consumed as real outgoing damage inside CombatKernel V2',()=>{\n  const player={...structuredClone(playableMortalCultivator),id:'p',stats:{...playableMortalCultivator.stats,attack:500},combatBuildV117:{fateV4:{damagePct:0}}};\n  const boosted=structuredClone(player); boosted.combatBuildV117.fateV4.damagePct=20;\n  const target={...structuredClone(heavySwordCultivator),id:'t',stats:{...heavySwordCultivator.stats,maxHp:20000,physique:1000}};\n  const a=runCombatKernelV2({mode:'realtime',registry,seed:8181,entities:[player,target],maxDuration:8}).battle;\n  const b=runCombatKernelV2({mode:'realtime',registry,seed:8181,entities:[boosted,target],maxDuration:8}).battle;\n  assert(b.finalState.t.hp<a.finalState.t.hp,`${a.finalState.t.hp} -> ${b.finalState.t.hp}`);\n});\n\n"""
          if marker not in s: raise SystemExit('missing combat test marker')
          s=s.replace(marker,generic+marker,1)
          insert="""\n# 2b) Personal Power: score the real Fate outgoing-damage modifier.\np='dist/core/personal-power.js'; s=read(p)\ns=rep(s,\n\"    const offense = Math.sqrt(safe(s.attack)) * 10\",\n\"    const fateDamageMultiplierV4=1+Math.max(0,Number(entity?.combatBuildV117?.fateV4?.damagePct)||0)/100;\\n    const offense = Math.sqrt(safe(s.attack)) * 10 * fateDamageMultiplierV4\",'personal power fate damage')\nwrite(p,s)\n\n"""
          anchor="# 3) Cultivation: Tu Mệnh applies to self-cultivation. Keep pure V140 provenance."
          if anchor not in s: raise SystemExit('missing personal power insertion anchor')
          s=s.replace(anchor,insert+anchor,1)
          guard="if 'lifeScore:this.previewCurrentLifeSettlement' in s or 'lifeScore:settlement.totalScore' in s: raise SystemExit('lifeScore reward dependency remains')"
          injected="s=s.replace(\"const finalized={...reward,energySpent,forcedPassing:!voluntary,lifeScore:settlement.totalScore,grade:settlement.grade};\",\"const finalized={...reward,energySpent,forcedPassing:!voluntary,grade:settlement.grade};\")\n"+guard
          if guard not in s: raise SystemExit('missing lifeScore guard')
          s=s.replace(guard,injected,1)
          p.write_text(s)
          PY
      - name: Apply patch
        run: python3 qa/reincarnation-v4-gameplay-patch.py
      - name: Rebalance Potential as global resonance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/core/reincarnation-progression-v1102.js'); s=p.read_text()
          old="""export const CORE_POTENTIAL_SOFT_CAP_MAX_PCT_V4=35;
          export const CORE_POTENTIAL_HALF_SATURATION_V4=1500;
          export function corePotentialPercentBonusV4(points){ const p=Math.max(0,Number(points)||0); return CORE_POTENTIAL_SOFT_CAP_MAX_PCT_V4*p/(p+CORE_POTENTIAL_HALF_SATURATION_V4); }
          export function applyCorePotentialStats(stats,runtime){
            if(!runtime) return {...stats};
            const life=cloneLifeCorePotentialState(runtime.life).allocations, permanent={...emptyAllocation(),...(runtime.permanent??{})};
            const power=life.power+Math.max(0,permanent.power||0),body=life.body+Math.max(0,permanent.body||0),defense=life.defense+Math.max(0,permanent.defense||0);
            const attackFlat=Math.max(0,(Number(stats.attack)||0)+power), attack=attackFlat*(1+corePotentialPercentBonusV4(power)/100);
            const defenseFlat=Math.max(0,(Number(stats.defense)||0)+defense*3), finalDefense=defenseFlat*(1+corePotentialPercentBonusV4(defense)/100);
            const basePhysique=Number.isFinite(stats.physique)?Math.max(0,stats.physique):Math.max(0,(Number(stats.maxHp)||0)/20);
            const physiqueFlat=basePhysique+body, physique=physiqueFlat*(1+corePotentialPercentBonusV4(body)/100);
            return {...stats,attack,defense:finalDefense,physique,maxHp:physique*20};
          }"""
          new="""export const CORE_POTENTIAL_SOFT_CAP_MAX_PCT_V4=35;
          export const CORE_POTENTIAL_HALF_SATURATION_V4=4500;
          export function corePotentialPercentBonusV4(points){ const p=Math.max(0,Number(points)||0); return CORE_POTENTIAL_SOFT_CAP_MAX_PCT_V4*p/(p+CORE_POTENTIAL_HALF_SATURATION_V4); }
          export function applyCorePotentialStats(stats,runtime){
            if(!runtime) return {...stats};
            const life=cloneLifeCorePotentialState(runtime.life).allocations, permanent={...emptyAllocation(),...(runtime.permanent??{})};
            const power=life.power+Math.max(0,permanent.power||0),body=life.body+Math.max(0,permanent.body||0),defense=life.defense+Math.max(0,permanent.defense||0);
            const resonance=1+corePotentialPercentBonusV4(power+body+defense)/100;
            const attack=Math.max(0,(Number(stats.attack)||0)+power)*resonance;
            const finalDefense=Math.max(0,(Number(stats.defense)||0)+defense*3)*resonance;
            const basePhysique=Number.isFinite(stats.physique)?Math.max(0,stats.physique):Math.max(0,(Number(stats.maxHp)||0)/20);
            const physique=(basePhysique+body)*resonance;
            return {...stats,attack,defense:finalDefense,physique,maxHp:physique*20};
          }"""
          if old not in s: raise SystemExit('missing axis soft-cap block')
          p.write_text(s.replace(old,new,1))

          p=Path('qa/tests/reincarnation-v4-gameplay-balance-test.js'); s=p.read_text()
          old="const balanced3=Math.floor(perLife3*lives/3),balanced10=Math.floor(perLife10*lives/3);\n    const p3=corePotentialPercentBonusV4(balanced3),p10=corePotentialPercentBonusV4(balanced10);\n    rows.push({lives,permanent3:perLife3*lives,balancedBonus3Pct:Number(p3.toFixed(2)),permanent10:perLife10*lives,balancedBonus10Pct:Number(p10.toFixed(2))});"
          new="const balanced3=Math.floor(perLife3*lives/3),balanced10=Math.floor(perLife10*lives/3);\n    const p3=corePotentialPercentBonusV4(perLife3*lives),p10=corePotentialPercentBonusV4(perLife10*lives);\n    rows.push({lives,permanent3:perLife3*lives,resonanceBonus3Pct:Number(p3.toFixed(2)),permanent10:perLife10*lives,resonanceBonus10Pct:Number(p10.toFixed(2))});"
          if old not in s: raise SystemExit('missing potential simulation rows')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Align baseline ownership tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/tests/v140-cultivation-core-test.js'); s=p.read_text()
          anchor="  session.stateValue.inheritedOrigins = { ...(session.stateValue.inheritedOrigins||{}), 'birth.cultivation.multiplier': 1 };"
          if anchor not in s: raise SystemExit('missing V140 fixture anchor')
          s=s.replace(anchor,anchor+"\n  session.stateValue.character.fateModifiersV4 = {};",1)
          p.write_text(s)

          p=Path('qa/tests/v129-global-build-balance-test.js'); s=p.read_text()
          old="import { applyCorePotentialStats, corePotentialDefinitions } from '../../dist/core/reincarnation-progression-v1102.js';"
          new="import { applyCorePotentialStats, corePotentialDefinitions, corePotentialPercentBonusV4 } from '../../dist/core/reincarnation-progression-v1102.js';"
          if old not in s: raise SystemExit('missing potential import anchor')
          s=s.replace(old,new,1)
          old="check(corePotentialDefinitions.find(x=>x.id==='defense')?.perPoint?.includes('Phòng Ngự +3'),'V108 preserves canonical Potential Defense = +3 defense per point; no extra buff added');"
          new="check(corePotentialDefinitions.find(x=>x.id==='defense')?.perPoint?.includes('Phòng Ngự +3'),'V4 preserves canonical Potential Defense flat = +3 defense per point before resonance');"
          if old not in s: raise SystemExit('missing potential flat invariant anchor')
          s=s.replace(old,new,1)
          old="check(potApplied.defense===130&&potApplied.attack===100,'V108 Defense Potential modifies canonical combat defense and does not leak into attack');"
          new="const expectedResonance=1+corePotentialPercentBonusV4(10)/100;\ncheck(Math.abs(potApplied.defense-130*expectedResonance)<1e-9&&Math.abs(potApplied.attack-100*expectedResonance)<1e-9,'V4 Potential keeps +3 Defense flat and applies one global resonance without axis leakage');"
          if old not in s: raise SystemExit('missing potential runtime invariant anchor')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax + dedicated
        run: |
          for f in dist/core/reincarnation-progression-v1102.js dist/core/character.js dist/core/cultivation-v140.js dist/core/combat.js dist/core/personal-power.js dist/core/session.js; do node --check "$f"; done
          node qa/tests/reincarnation-v4-lifecycle-contract-test.js
          node qa/tests/reincarnation-v4-gameplay-balance-test.js
          node qa/tests/reincarnation-cultivation-r3-cost-invariant-test.js
          node qa/tests/reincarnation-cultivation-r3-test.js
          node qa/tests/reincarnation-fate-build-v4-test.js
          node qa/tests/v140-cultivation-core-test.js
          node qa/tests/v140-cultivation-transport-test.js
          node qa/tests/v140-zero-legacy-test.js
      - name: Backend fast
        run: node qa/runners/v140-backend-gates.js fast
      - name: Frontend fast
        run: node qa/runners/v140-frontend-gates.js fast
      - name: Backend closure
        run: node qa/runners/v140-backend-gates.js closure
      - name: Frontend closure
        run: node qa/runners/v140-frontend-gates.js closure
      - name: Commit clean runtime
        run: |
          rm -f qa/reincarnation-v4-gameplay-patch.py
          rm -f .github/workflows/reincarnation-v4-gameplay-apply.yml
          rm -f .github/workflows/reincarnation-v4-gameplay-apply-r2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire reincarnation v4 fate rp and potential"
          git push origin HEAD:feature/reincarnation-cultivation-r3
