name: V141 Refactor Apply

on:
  push:
    branches:
      - 'refactor/v141-codebase-optimization'
    paths:
      - '.v141-refactor-trigger'

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply structural cleanup
        run: |
          node qa/tools/v141-extract-gameplay-dispatch.js
          node qa/tools/v141-split-bind-dynamic.js
          node qa/tools/v141-prune-app-dead-functions.js
          node qa/tools/v141-prune-core-dead-functions.js
          node qa/tools/v141-prune-hotspot-dead-functions.js
          node qa/tools/v141-prune-unused-named-imports.js

      - name: Syntax check
        run: |
          node --check app.js
          node --check dist/core/session.js
          node --check dist/core/session-restore.js
          node --check dist/core/gameplay.js
          node --check dist/core/gameplay-dispatch.js
          node --check dist/core/combat.js
          node --check modules/hunt-combat-v2.js

      - name: Fast canonical gates
        run: |
          node qa/runners/v140-backend-gates.js fast
          node qa/runners/v140-frontend-gates.js fast

      - name: Commit generated refactor
        run: |
          if git diff --quiet; then
            echo "No refactor changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js dist/core/session.js dist/core/session-restore.js dist/core/gameplay.js dist/core/gameplay-dispatch.js dist/core/combat.js modules/hunt-combat-v2.js
          git commit -m "refactor: apply safe V141 structural cleanup"
          git push origin HEAD:refactor/v141-codebase-optimization
