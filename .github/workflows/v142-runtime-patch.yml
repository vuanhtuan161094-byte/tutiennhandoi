name: V142 Runtime Patch

on:
  push:
    branches:
      - feature/v142-equipment-hunt
    paths:
      - 'qa/tools/apply-v142-runtime-patch.mjs'
      - '.github/workflows/v142-runtime-patch.yml'

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v142-equipment-hunt
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply V142 runtime patch
        run: node qa/tools/apply-v142-runtime-patch.mjs

      - name: Verify syntax
        run: |
          node --check dist/core/session.js
          node --check dist/core/equipment.js
          node qa/runners/v142-equipment-hunt-gate.js

      - name: Commit patched runtime
        run: |
          if git diff --quiet; then
            echo "No runtime changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/core/session.js dist/core/equipment.js
          git commit -m "feat(v142): integrate ranked equipment fragments into Hunt runtime"
          git push origin HEAD:feature/v142-equipment-hunt
