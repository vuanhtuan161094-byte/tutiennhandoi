name: AI Browser Playtest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'standalone-entry.js'
      - 'standalone-runtime.js'
      - 'styles.css'
      - 'ui-*.css'
      - 'combat-v2.css'
      - 'assets/**'
      - 'modules/**'
      - 'dist/**'
      - 'web/server.mjs'
      - 'qa/playtest/**'
      - 'qa/visual/**'
      - 'qa/tests/ui-visual-workflow-contract-test.js'
      - 'qa/runners/v140-frontend-gates.js'
      - 'AGENTS.md'
      - 'docs/ai/**'
      - 'docs/DEVELOPMENT_PROTOCOL.md'
      - '.github/workflows/ai-playtest.yml'

permissions:
  contents: read

concurrency:
  group: ai-playtest-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: cmd

jobs:
  browser-playtest:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locate installed Chrome
        run: |
          @echo off
          set "CHROME="
          if exist "%ProgramFiles%\Google\Chrome\Application\chrome.exe" set "CHROME=%ProgramFiles%\Google\Chrome\Application\chrome.exe"
          if not defined CHROME if exist "%ProgramFiles(x86)%\Google\Chrome\Application\chrome.exe" set "CHROME=%ProgramFiles(x86)%\Google\Chrome\Application\chrome.exe"
          if not defined CHROME for /f "tokens=2,*" %%A in ('reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe" /ve 2^>nul ^| find "REG_SZ"') do set "CHROME=%%B"
          if not defined CHROME (
            echo Chrome executable was not found for the self-hosted runner.
            exit /b 1
          )
          echo Chrome found at: %CHROME%
          echo CHROME_PATH=%CHROME%>>"%GITHUB_ENV%"

      - name: Validate AI pipeline contracts
        run: node qa/playtest/validate-contracts.mjs

      - name: Start canonical game server
        run: |
          @echo off
          if not exist artifacts\ai-playtest mkdir artifacts\ai-playtest
          start "" /b node web/server.mjs 4173 127.0.0.1 > artifacts\ai-playtest\server.log 2>&1
          for /L %%A in (1,1,30) do (
            curl.exe --fail --silent http://127.0.0.1:4173/__tutien_launcher_health > artifacts\ai-playtest\health.json && exit /b 0
            timeout /t 1 /nobreak >nul
          )
          type artifacts\ai-playtest\server.log
          exit /b 1

      - name: Run deterministic browser journeys
        run: node qa/playtest/run-scenarios.mjs --base http://127.0.0.1:4173 --out artifacts/ai-playtest

      - name: Publish strict playtest summary
        if: always()
        env:
          TUTIEN_PLAYTEST_SHA: ${{ github.sha }}
        run: node qa/playtest/summarize-report.mjs artifacts/ai-playtest/playtest-report.json

      - name: Upload exact-SHA AI playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-playtest-${{ github.sha }}
          path: artifacts/ai-playtest/
          if-no-files-found: error
          retention-days: 14
