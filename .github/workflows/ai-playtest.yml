name: AI Browser Playtest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'docs/ai/**'
      - 'qa/playtest/**'
      - 'assets/_pipeline/**'
      - '.github/workflows/ai-playtest.yml'

permissions:
  contents: read

concurrency:
  group: ai-playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Validate AI pipeline contracts
        run: node qa/playtest/validate-contracts.mjs

      - name: Start canonical game server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ai-playtest
          node web/server.mjs 4173 127.0.0.1 > artifacts/ai-playtest/server.log 2>&1 &
          echo $! > artifacts/ai-playtest/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/__tutien_launcher_health > artifacts/ai-playtest/health.json; then
              exit 0
            fi
            sleep 0.5
          done
          cat artifacts/ai-playtest/server.log
          exit 1

      - name: Run deterministic browser journeys
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node qa/playtest/run-scenarios.mjs --base http://127.0.0.1:4173 --out artifacts/ai-playtest

      - name: Validate report exists
        if: always()
        shell: bash
        run: |
          test -s artifacts/ai-playtest/playtest-report.json

      - name: Upload AI playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-playtest-${{ github.sha }}
          path: artifacts/ai-playtest/
          if-no-files-found: error
          retention-days: 14
