name: Mind M1 closure docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mind-m1-close-docs.yml

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply closure documentation
        shell: cmd
        run: |
          node --check tools\mind-m1-close-docs.mjs
          if errorlevel 1 exit /b 1
          node tools\mind-m1-close-docs.mjs
          if errorlevel 1 exit /b 1

      - name: Re-run M1 contract gates
        shell: cmd
        run: |
          node qa\tests\mind-dao-m1-seal-transaction-test.js
          if errorlevel 1 exit /b 1
          node qa\tests\mind-dao-m1-authority-test.js
          if errorlevel 1 exit /b 1
          node qa\tests\mind-dao-production-contract-test.js
          if errorlevel 1 exit /b 1
          node qa\tests\mind-dao-skill-form-contract-test.js
          if errorlevel 1 exit /b 1

      - name: Verify no gameplay drift
        shell: cmd
        run: |
          git diff --exit-code -- dist\core dist\content
          if errorlevel 1 exit /b 1

      - name: Commit closure record
        shell: cmd
        run: |
          git rm .github\workflows\mind-m1-close-docs.yml tools\mind-m1-close-docs.mjs
          if errorlevel 1 exit /b 1
          git add CURRENT_CHECKPOINT.md docs\runtime\MIND_DAO_PRODUCTION_CONTRACT_20260929.md docs\runtime\MIND_DAO_M1_CLOSURE_20260929.md qa\tests\mind-dao-production-contract-test.js
          if errorlevel 1 exit /b 1
          git config user.name "github-actions[bot]"
          if errorlevel 1 exit /b 1
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if errorlevel 1 exit /b 1
          git commit -m "docs(mind): close M1 and open M2"
          if errorlevel 1 exit /b 1
          git push origin HEAD:main
          if errorlevel 1 exit /b 1
