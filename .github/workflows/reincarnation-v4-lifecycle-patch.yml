                      "const inheritance = { orientationId:'balanced', selectedDaoSeedId:selectedSeed?.id, inheritedKarmaNpcIds:[...new Set(plan.inheritKarmaNpcIds??[])], boundRelicArtifactIds:selectedRelicIds, memoryFragments, fateLocksUsed:0 };")
