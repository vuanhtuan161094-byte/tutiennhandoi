name: V144 Finalize Retirement

on:
  push:
    branches:
      - feature/v142-equipment-hunt

permissions:
  contents: write

jobs:
  finalize:
    if: "startsWith(github.event.head_commit.message, 'chore(v144): finalize retirement closure')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V144 source repairs for diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('dist/core/session.js'); s=path.read_text(encoding='utf-8')
          pattern=re.compile(r"(?m)^\s{12}id: def\.id, name: def\.name, grade: def\.grade \?\? 'mundane'.*\n\s{8}\}\)\)\.sort\(.*\);\n")
          s,n=pattern.subn('',s,count=1)
          if n!=1: raise SystemExit(f'session residue count={n}')
          path.write_text(s,encoding='utf-8')
          path=Path('dist/core/client-shell.js'); s=path.read_text(encoding='utf-8')
          old='spiritualRoots: api.getSpiritualRootsV131(), elementSeals: api.getElementSealsV133(), collection'
          if old not in s: raise SystemExit('client-shell residue not found')
          path.write_text(s.replace(old,'spiritualRoots: api.getSpiritualRootsV131(), collection',1),encoding='utf-8')
          path=Path('qa/tests/v129-stat-provenance-test.js'); s=path.read_text(encoding='utf-8')
          old="  const crit=stat(p,'critChancePct');\n  assert(crit.sources.some(x=>x.id==='character.techniques'),'live Bí Thuật contribution must be traceable when it changes Crit');"
          if old not in s: raise SystemExit('provenance residue not found')
          path.write_text(s.replace(old,"  assert(!ids.has('character.techniques'),'retired V103/V119 Công Pháp combat source must not survive in provenance');",1),encoding='utf-8')
          path=Path('qa/tests/v129-global-build-balance-test.js'); s=path.read_text(encoding='utf-8')
          marker='const setSpread=Math.max(...Object.values(setMeans))/Math.min(...Object.values(setMeans));'
          if marker not in s: raise SystemExit('set spread marker not found')
          s=s.replace(marker,"console.log('V144_SET_MEANS_DIAG',JSON.stringify(setMeans));\n"+marker,1)
          path.write_text(s,encoding='utf-8')
          PY
      - name: Diagnose set envelope
        run: node qa/tests/v129-global-build-balance-test.js
