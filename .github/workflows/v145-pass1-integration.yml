name: V145 Pass1 Integration

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v142-equipment-hunt
    paths:
      - 'qa/tools/v145-pass1-integration.mjs'
      - 'qa/tools/v145-pass1-fix.mjs'
      - '.github/workflows/v145-pass1-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v142-equipment-hunt
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded V145 pass1
        run: node qa/tools/v145-pass1-integration.mjs
      - name: Remove remaining legacy root hooks
        run: node qa/tools/v145-pass1-fix.mjs
      - name: V145 targeted
        run: node qa/tests/v145-spiritual-root-redesign-test.js
      - name: V140 cultivation core
        run: node qa/tests/v140-cultivation-core-test.js
      - name: V141 Hunt x Cultivation
        run: node qa/tests/v141-hunt-cultivation-closure-test.js
      - name: V142 Equipment x Hunt
        run: node qa/runners/v142-equipment-hunt-gate.js
      - name: V144 retirement
        run: node qa/tests/v144-technique-v103-retirement-test.js
      - name: Backend fast gate
        run: node qa/runners/v140-backend-gates.js fast
      - name: Remove temporary machinery
        run: rm qa/tools/v145-pass1-integration.mjs qa/tools/v145-pass1-fix.mjs .github/workflows/v145-pass1-integration.yml
      - name: Commit pass1 source
        run: |
          git config user.name 'vuanhtuan161094-byte'
          git config user.email 'vuanhtuan161094@gmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v145): integrate infinite spiritual root runtime'
          git push origin HEAD:feature/v142-equipment-hunt
