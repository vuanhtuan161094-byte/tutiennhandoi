name: V142 Equipment UI Transport Patch

on:
  push:
    branches:
      - feature/v142-equipment-hunt
    paths:
      - 'qa/tools/apply-v142-ui-transport-patch.mjs'
      - '.github/workflows/v142-ui-transport-patch.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v142-equipment-hunt
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V142 UI transport patch
        run: node qa/tools/apply-v142-ui-transport-patch.mjs
      - name: Verify V142 UI transport
        run: |
          node --check dist/core/gameplay.js
          node --check dist/core/gameplay-dispatch.js
          node --check app.js
          node qa/tests/v142-equipment-ui-transport-test.js
          node qa/runners/v142-equipment-hunt-gate.js
      - name: Commit patched runtime
        run: |
          if git diff --quiet; then
            echo "No UI transport changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/core/gameplay.js dist/core/gameplay-dispatch.js app.js
          git commit -m "feat(v142): expose equipment fragment workshop in UI"
          git push origin HEAD:feature/v142-equipment-hunt
