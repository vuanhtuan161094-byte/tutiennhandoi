name: Self-hosted Runner Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner info
        shell: cmd
        run: |
          echo ===== SELF HOSTED RUNNER =====
          echo Computer: %COMPUTERNAME%
          echo User: %USERNAME%
          echo Working directory: %CD%
          node --version
          git --version

      - name: Run backend fast QA
        shell: cmd
        run: node qa/runners/v140-backend-gates.js fast

      - name: Run frontend fast QA
        shell: cmd
        run: node qa/runners/v140-frontend-gates.js fast
