name: V148 Balance Patch
on:
  push:
    branches:
      - feature/v148-confidant-rebuild
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply role-aware V129 rebalance
        shell: python
        run: |
          from pathlib import Path
          p=Path('dist/core/confidant-v87.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            "effects: [damage(.40, 14, 'Metal'), status('status.armor_fracture', 4)]":"effects: [damage(.42, 14, 'Metal'), status('status.armor_fracture', 4)]",
            "effects: [status('status.armor_fracture', 5), damage(.86, 30, 'Metal')]":"effects: [status('status.armor_fracture', 5), damage(.90, 30, 'Metal')]",
            "effects: [spirit(12), status('status.wind_step', 4, 'self'), damage(.28, 4, 'Wind')]":"effects: [spirit(12), status('status.wind_step', 2.5, 'self'), damage(.22, 4, 'Wind')]",
            "effects: [spirit(20), status('status.wind_step', 6, 'self'), damage(.64, 12, 'Wind')]":"effects: [spirit(20), status('status.wind_step', 4, 'self'), damage(.50, 12, 'Wind')]",
            "effects: [damage(.46, 18, 'Metal')]":"effects: [damage(.42, 18, 'Metal')]",
            "effects: [status('status.rhino_armor_broken', 4), damage(.94, 34, 'Metal')]":"effects: [status('status.rhino_armor_broken', 4), damage(.82, 34, 'Metal')]",
            "effects: [damage(.34, 8, 'Poison'), status('status.poison_weakened', 4)]":"effects: [damage(.28, 8, 'Poison'), status('status.poison_weakened', 4)]",
            "effects: [{ type: 'removeStatus', groups: ['Debuff', 'BodyControl', 'SpiritControl'], target: 'self' }, heal(4)]":"effects: [{ type: 'removeStatus', groups: ['Debuff', 'BodyControl', 'SpiritControl'], target: 'self' }, heal(8), shield(.14, 5)]",
            "effects: [status('status.soul_exposed', 4), damage(.70, 20, 'Poison')]":"effects: [status('status.soul_exposed', 3), shield(.08, 2), damage(.55, 20, 'Poison')]",
            "'companion.4': [{event:'OnHit',sourceTags:['ActiveHit'],gain:6},{event:'OnShieldBreak',gain:35}]":"'companion.4': [{event:'OnHit',sourceTags:['ActiveHit'],gain:10},{event:'OnShieldBreak',gain:30}]",
            "'companion.5': [{event:'OnHit',sourceTags:['ActiveHit'],gain:8},{event:'OnDodge',gain:12}]":"'companion.5': [{event:'OnHit',sourceTags:['ActiveHit'],gain:6},{event:'OnDodge',gain:10}]",
            "'companion.7': [{event:'OnHit',sourceTags:['ActiveHit'],gain:5},{event:'OnCrit',sourceTags:['ActiveHit'],gain:24},{event:'OnShieldBreak',gain:28}]":"'companion.7': [{event:'OnHit',sourceTags:['ActiveHit'],gain:4},{event:'OnCrit',sourceTags:['ActiveHit'],gain:14},{event:'OnShieldBreak',gain:24}]",
          }
          for old,new in replacements.items():
            count=s.count(old)
            if count!=1: raise SystemExit(f'Expected exactly 1 match, found {count}: {old}')
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/core/confidant-v87.js
          git commit -m "balance(v148): calibrate confidants against V129 benchmark"
          git push origin HEAD:feature/v148-confidant-rebuild
