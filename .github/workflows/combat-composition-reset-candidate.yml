name: Combat Composition Reset Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/combat-composition-reset-candidate.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Compact candidate CSS block under hard budget
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply_combat_composition_reset.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('from pathlib import Path\n','from pathlib import Path\nimport re\n',1)
          old="s = s[:s.index(PORTRAIT_ANCHOR)].rstrip() + '\\n\\n' + INFO_BLOCK"
          new="cut=INFO_BLOCK.rfind('@media(max-width:360px)')\nsource=INFO_BLOCK[:cut] if cut>=0 else INFO_BLOCK\nsource=source.replace('box-shadow:0 3px 8px rgba(0,0,0,.22)!important','').replace('.huntv2-combat-v8 .huntv2-rail-btn i{font-size:11px!important}\\n','').replace('opacity:.72!important','').replace('max-width:76%!important','')\ncompact = re.sub(r'\\s*([{};,])\\s*', r'\\1', re.sub(r'\\s+', ' ', source)).strip()\ncompact = re.sub(r'/\\* Combat composition reset candidate.*?\\*/','/* Combat composition reset candidate */',compact,count=1)\ns = s[:s.index(PORTRAIT_ANCHOR)].rstrip() + '\\n\\n' + compact + '\\n'\ns = s.replace('/* battleEnd is progression-only; Hunt economy is settled by timed virtual farm. */\\n','')"
          if old not in s:
              raise SystemExit('patcher compaction anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply presentation-only combat reset
        run: python .github/scripts/apply_combat_composition_reset.py
      - name: Targeted checks
        run: |
          node --check ui-combat-target-v1.js
          node --check qa/visual/capture-combat-runtime.mjs
          node qa/tests/ui-combat-readability-target-test.js
      - name: Self-clean and commit candidate patch
        run: |
          git rm .github/workflows/combat-composition-reset-candidate.yml .github/scripts/apply_combat_composition_reset.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-combat-information-v1.css ui-combat-target-v1.js index.html qa/tests/ui-combat-readability-target-test.js qa/visual/capture-combat-runtime.mjs
          git commit -m 'fix(ui): reset combat portrait composition hierarchy'
          git push origin HEAD:main
