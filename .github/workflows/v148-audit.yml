name: V148 Balance Audit
on:
  push:
    branches: [feature/v148-confidant-rebuild]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: V148 balance simulation
        run: |
          node --input-type=module <<'NODE'
          import {createCollectionProgressStateV12316} from './dist/core/collection-progression-v12316.js';
          import {gachaCollectionV12326} from './dist/core/collection-workshop-gacha-v12326.js';
          import {CONFIDANTS_V87,confidantHeartPowerV148,confidantFortuneSummaryV148,confidantViewV148} from './dist/core/confidant-v87.js';
          const s=createCollectionProgressStateV12316();
          s.currencies.boundImmortalJade=1e12;
          s.economyV12325={genericFragments:{heart:0,relic:0},ascensionEssence:{manual:0,heart:0,artifact:0,relic:0,pet:0,companion:0},extraItems:{},tracks:{},history:[],daily:{dayKey:'',clearedIds:[]}};
          for(const d of CONFIDANTS_V87)s.items[d.id]={owned:true,level:1,advance:0,stars:0,specificFragments:0,confidantHeartV148:{assist:0,guard:0,harmony:0,raw:0}};
          s.confidantV87Migrated=true;s.confidantV148Migrated=true;
          const start=Object.fromEntries(CONFIDANTS_V87.map(d=>[d.id,s.items[d.id].specificFragments]));
          const pulls=50000;const rows={};for(const d of CONFIDANTS_V87)rows[d.id]={name:d.name,grade:d.grade,fragments:0,hits:0,items:0};
          for(let i=0;i<pulls/10;i++){
            const r=gachaCollectionV12326(s,{},'banner.companion',10,1480000+i,false,[],117);
            for(const x of r.results)if(x.id){rows[x.id].hits++;if(x.kind==='fragment')rows[x.id].fragments+=x.fragments||0;else if(x.kind==='item'){rows[x.id].items++;rows[x.id].fragments+=x.fragments||0;}}
          }
          console.log('=== GACHA 50K ===');
          for(const d of CONFIDANTS_V87){const x=rows[d.id],actual=s.items[d.id].specificFragments-start[d.id];console.log(d.id,d.name,d.grade,'fragments',actual,'frag/pull',(actual/pulls).toFixed(5),'pulls/star',(10/(actual/pulls)).toFixed(1),'hits',x.hits,'full',x.items);}
          console.log('=== POWER CURVE ===');
          for(const stars of [0,5,20,50,100,300,1000]){
            const level=100+50*stars;
            const p={owned:true,stars,advance:Math.min(4,Math.floor(stars/5)),level,specificFragments:0,confidantHeartV148:{assist:10,guard:10,harmony:10,raw:Math.max(0,Math.floor(stars/10)-30)}};
            console.log('stars',stars,'level',level,'mystic',confidantHeartPowerV148(p,'companion.5'),'heaven',confidantHeartPowerV148(p,'companion.1'),'immortal',confidantHeartPowerV148(p,'companion.7'));
          }
          console.log('=== ALL 8 RAW FORTUNE ===');
          for(const stars of [0,20,100,300,1000]){
            const st=createCollectionProgressStateV12316();st.confidantV87Migrated=true;st.confidantV148Migrated=true;
            for(const d of CONFIDANTS_V87)st.items[d.id]={owned:true,stars,advance:Math.min(4,Math.floor(stars/5)),level:100+50*stars,specificFragments:0,confidantHeartV148:{assist:10,guard:10,harmony:10,raw:Math.max(0,Math.floor(stars/10)-30)}};
            console.log(stars,confidantFortuneSummaryV148(st));
          }
          console.log('=== LEGACY MAX VIEW ===');
          const l=createCollectionProgressStateV12316();l.items['companion.1']={owned:true,level:100,advance:4,specificFragments:0};l.confidantV87Migrated=true;
          const {migrateConfidantsV148}=await import('./dist/core/confidant-v87.js');migrateConfidantsV148(l);console.log(l.items['companion.1'],confidantViewV148(l,'companion.1'));
          NODE
      - name: Legacy production surface audit
        run: |
          echo '=== old Fate / fixed intimacy production strings ==='
          grep -R -n -E 'Duyên I|Duyên II|Duyên III|Duyên IV|Duyên V|Thân Mật [^$]*100|CONFIDANT_MAX_FATE_V87|CONFIDANT_MAX_INTIMACY_V87|confidantCombatTriggersV87\(' app.js standalone-runtime.js dist/core modules 2>/dev/null | head -n 250 || true
          echo '=== legacy percent fortune consumers ==='
          grep -R -n -E 'fortune\.(cultivationPct|huntRewardPct|craftQualityPct)' dist/core modules app.js 2>/dev/null | head -n 100 || true
          echo '=== production V148 markers ==='
          grep -R -n -E 'confidant\.v148|CONFIDANT_.*V148|Duyên ★|100 Đồng Tâm|confidantHeartV148' app.js standalone-runtime.js dist/core modules 2>/dev/null | head -n 250 || true
