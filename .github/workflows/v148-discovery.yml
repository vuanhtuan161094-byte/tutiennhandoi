name: V148 Confidant Discovery

on:
  push:
    branches:
      - feature/v148-confidant-rebuild

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate confidant integration surfaces
        run: |
          echo '=== collection UI action handlers ==='
          grep -R -n -E 'collection-(advance|strengthen).*v12325|advanceCollectionEconomyV12325|strengthenCollectionEconomyV12325|activeCompanionId' app.js dist/core/session.js modules 2>/dev/null | head -n 350 || true
          echo '=== specialty consumers ==='
          grep -R -n -E "specialty\.id|activeConfidantSpecialtyV87|cultivationPct|huntRewardPct|craftQualityPct" dist modules app.js 2>/dev/null | head -n 400 || true
          echo '=== fireTriggers call sites ==='
          grep -n "fireTriggers(" dist/core/combat.js || true
