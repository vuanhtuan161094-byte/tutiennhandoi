name: V148 Confidant Discovery
on:
  push:
    branches: [feature/v148-confidant-rebuild]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate action routing and exact V148 anchors
        run: |
          grep -R -n -C 5 -E "collectionAdvanceV12325|collectionStrengthenV12325|collectionEquipV12325|collectionComposeV12326" dist modules *.js 2>/dev/null | head -n 450 || true
          echo '=== collection summary/cultivation ==='
          grep -n -C 6 -E "collectionCultivationMultiplierV12316|collectionConfidantV87Summary|confidantCombatTriggersV87" dist/core/collection-progression-v12316.js || true
