name: V148 Confidant Discovery

on:
  push:
    branches:
      - feature/v148-confidant-rebuild

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate V148 patch anchors
        run: |
          echo '=== session collection action strings ==='
          grep -n -C 8 -E "collectionStrengthenV12325|collectionAdvanceV12325|collectionEquipV12325" dist/core/session.js || true
          echo '=== app action renderer context ==='
          grep -n -C 3 -E "selected.category==='companion'|data-collection-advance-v12325" app.js | head -n 120 || true
          echo '=== specialty consumers ==='
          grep -n -C 3 -E "huntRewardPct|fortuneQuality|gardenPct|discountPct = specialty|forgingTalentModifiersV87" dist/core/session.js || true
